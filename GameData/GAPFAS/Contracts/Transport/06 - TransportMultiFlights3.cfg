	// -----------------------------------------------------------------
	// Haversine Distance Calculations between waypoints
	// -----------------------------------------------------------------
	  
	DATA
	{
		type = int
		fltLocationSelection0 = 0 // Always refers to KSC
	}
	DATA
	{
		type = double
		hidden = true

        // Inputs from Group Level data
        // Flight locations KSC, to randomly selected airport 
        lat0 = @GFAS:siteLAT.ElementAt(0)
        lon0 = @GFAS:siteLON.ElementAt(0)
		lat1 = @GFAS:siteLAT.ElementAt(@/fltLocationSelection)
        lon1 = @GFAS:siteLON.ElementAt(@/fltLocationSelection)
		lat2 = @GFAS:siteLAT.ElementAt(@/fltLocationSelection2)
        lon2 = @GFAS:siteLON.ElementAt(@/fltLocationSelection2)
       radius = @GFAS:whereAreWe.Radius() // in meters

        // Constants
        PI = 3.141592653589793

        // Multi-step haversine calculation  KSC to Site 1
        dLat1 = (@/lat1 - @/lat0) * @/PI / 180.0
        dLon1 = (@/lon1 - @/lon0) * @/PI / 180.0
        lat1r1 = @/lat0 * @/PI / 180.0
        lat2r1 = @/lat1 * @/PI / 180.0
        a1 = Pow(Sin(@/dLat1 / 2.0), 2) + Pow(Sin(@/dLon1 / 2.0), 2) * Cos(@/lat1r1) * Cos(@/lat2r1)
        c1 = 2.0 * Asin(Pow(@/a1, 0.5))
		// final result (meters)
        d1 = @/radius * @/c1
		
	    // Multi-step haversine calculation  Site 1 to Site 2
        dLat2 = (@/lat2 - @/lat1) * @/PI / 180.0
        dLon2 = (@/lon2 - @/lon1) * @/PI / 180.0
        lat1r2 = @/lat1 * @/PI / 180.0
        lat2r2 = @/lat2 * @/PI / 180.0
        a2 = Pow(Sin(@/dLat2 / 2.0), 2) + Pow(Sin(@/dLon2 / 2.0), 2) * Cos(@/lat1r2) * Cos(@/lat2r2)
        c2 = 2.0 * Asin(Pow(@/a2, 0.5))
		// final result (meters)
        d2 = @/radius * @/c2	

	    // Multi-step haversine calculation  Site 2 to KSC
        dLat3 = (@/lat0 - @/lat2) * @/PI / 180.0
        dLon3 = (@/lon0 - @/lon2) * @/PI / 180.0
        lat1r3 = @/lat2 * @/PI / 180.0
        lat2r3 = @/lat0 * @/PI / 180.0
        a3 = Pow(Sin(@/dLat3 / 2.0), 2) + Pow(Sin(@/dLon3 / 2.0), 2) * Cos(@/lat1r3) * Cos(@/lat2r3)
        c3 = 2.0 * Asin(Pow(@/a3, 0.5))
		// final result (meters)
        d3 = @/radius * @/c3

	}
	// Convert to integer and km 
	DATA
	{
		type = int
		hidden = true
		distance1 = int(@/d1) / 1000
		distance2 = int(@/d2) / 1000
		distance3 = int(@/d3) / 1000
		totalDistance = @/distance1 + @/distance2 + @/distance3
	}

