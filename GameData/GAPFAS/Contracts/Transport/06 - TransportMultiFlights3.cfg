//---------------------------------------------------------------
// Multi Site Math Package 
//---------------------------------------------------------------
	DATA
	{
		type = double
		hidden = true

        // Inputs from Group Level data
        // Flight locations KSC, to randomly selected airport 
        lat0 = @GFAS:siteLAT.ElementAt(0)
        lon0 = @GFAS:siteLON.ElementAt(0)
		lat1 = @GFAS:siteLAT.ElementAt(@/fltLocationSelection)
        lon1 = @GFAS:siteLON.ElementAt(@/fltLocationSelection)
		lat2 = @GFAS:siteLAT.ElementAt(@/fltLocationSelection2)
        lon2 = @GFAS:siteLON.ElementAt(@/fltLocationSelection2)
        
        // Constants
        PI = 3.141592653589793
		radius = @GFAS:whereAreWe.Radius() // in meters
		
		// Location Radian values 
		lat0Rad = @/lat0 * @/PI / 180.0
		lon0Rad = @/lon0 * @/PI / 180.0
		lat1Rad = @/lat1 * @/PI / 180.0
		lon1Rad = @/lon1 * @/PI / 180.0
		lat2Rad = @/lat2 * @/PI / 180.0
		//Trip Radian values
		dLat1 = (@/lat1 - @/lat0) * @/PI / 180.0
        dLon1 = (@/lon1 - @/lon0) * @/PI / 180.0
		dLat2 = (@/lat2 - @/lat1) * @/PI / 180.0
        dLon2 = (@/lon2 - @/lon1) * @/PI / 180.0
        dLat3 = (@/lat0 - @/lat2) * @/PI / 180.0
        dLon3 = (@/lon0 - @/lon2) * @/PI / 180.0
		
	//-----------------------------------------------------------------------------------------	
	// Trip 1
	//-----------------------------------------------------------------------------------------	
		//--------------------------
		// Distance Calculations
		//--------------------------
        
		// Multi-step haversine calculation  KSC to Site 1
        a1 = Pow(Sin(@/dLat1 / 2.0), 2) + Pow(Sin(@/dLon1 / 2.0), 2) * Cos(@/lat0Rad) * Cos(@/lat1Rad)
        c1 = 2.0 * Asin(Pow(@/a1, 0.5))
		
		// final result (meters)
        d1 = @/radius * @/c1

		//--------------------------
		// Heading Calculations
		//--------------------------
		
		// Multi-step heading calculation  KSC to Site 1
		y1 = Sin(@/dLon1) * Cos(@/lat1Rad)
		x1 = Cos(@/lat0Rad) * Sin(@/lat1Rad) - Sin(@/lat0Rad) * Cos(@/lat1Rad) * Cos(@/dLon1)
		theta1 = @/x1 == 0 ? (@/y1 >= 0 ? 90.0 : 270.0) : (@/x1 < 0 ? (Atan(@/y1 / @/x1) * 180.0 / @/PI + 180.0) : (Atan(@/y1 / @/x1) * 180.0 / @/PI))
				 
	//-----------------------------------------------------------------------------------------	
	// Trip 2
	//-----------------------------------------------------------------------------------------	
		//--------------------------
		// Distance Calculations
		//--------------------------		
	    
		// Multi-step haversine calculation  Site 1 to Site 2
        a2 = Pow(Sin(@/dLat2 / 2.0), 2) + Pow(Sin(@/dLon2 / 2.0), 2) * Cos(@/lat1Rad) * Cos(@/lat2Rad)
        c2 = 2.0 * Asin(Pow(@/a2, 0.5))
		
		// final result (meters)
        d2 = @/radius * @/c2
		
		//--------------------------
		// Heading Calculations
		//--------------------------		
		
		// Multi-step heading calculation Site 1 to Site 2
		y2 = Sin(@/dLon2) * Cos(@/lat2Rad)
		x2 = Cos(@/lat1Rad) * Sin(@/lat2Rad) - Sin(@/lat1Rad) * Cos(@/lat2Rad) * Cos(@/dLon2)
		theta2 = @/x2 == 0 ? (@/y2 >= 0 ? 90.0 : 270.0) : (@/x2 < 0 ? (Atan(@/y2 / @/x2) * 180.0 / @/PI + 180.0) : (Atan(@/y2 / @/x2) * 180.0 / @/PI))
				 
	//-----------------------------------------------------------------------------------------	
	// Trip 3
	//-----------------------------------------------------------------------------------------	
		//--------------------------
		// Distance Calculations
		//--------------------------
	    
		// Multi-step haversine calculation  Site 2 to KSC
        a3 = Pow(Sin(@/dLat3 / 2.0), 2) + Pow(Sin(@/dLon3 / 2.0), 2) * Cos(@/lat2Rad) * Cos(@/lat0Rad)
        c3 = 2.0 * Asin(Pow(@/a3, 0.5))
		
		// final result (meters)
        d3 = @/radius * @/c3

		//--------------------------
		// Heading Calculations 
		//--------------------------		

		// Multi-step heading calculation Site 2 to KSC
		y3 = Sin(@/dLon3) * Cos(@/lat0Rad)
		x3 = Cos(@/lat2Rad) * Sin(@/lat0Rad) - Sin(@/lat2Rad) * Cos(@/lat0Rad) * Cos(@/dLon3)
		theta3 = @/x3 == 0 ? (@/y3 >= 0 ? 90.0 : 270.0) : (@/x3 < 0 ? (Atan(@/y3 / @/x3) * 180.0 / @/PI + 180.0) : (Atan(@/y3 / @/x3) * 180.0 / @/PI))

		//-----------------------------------------------------------------------------------------	
		// Convert heading to degrees
		//-----------------------------------------------------------------------------------------	
		heading1 = @/theta1 < 0 ? Round(@/theta1 + 360.0 ) : Round(@/theta1)
		heading2 = @/theta2 < 0 ? Round(@/theta2 + 360.0 ) : Round(@/theta2) 	// Only used if there are three waypoints
		heading3 = @/theta3 < 0 ? Round(@/theta3 + 360.0 ) : Round(@/theta3)	// Only used if there are three waypoints		

	}
	
	//-----------------------------------------------------------------------------------------	
	// Normalize Distance to km
	//-----------------------------------------------------------------------------------------	
	DATA
	{
		type = int
		hidden = true
		// Convert to integer and km 
		distance1 = int(@/d1) / 1000
		distance2 = int(@/d2) / 1000
		distance3 = int(@/d3) / 1000
		totalDistance = @/distance1 + @/distance2 + @/distance3
		
	}
//---------------------------------------------------------------
// Math Package end
//---------------------------------------------------------------

