	title = KSPAS Flight @/flightNumber - @/baseIATAcode0 to @/baseFullName and @/baseFullName2 - Total Distance: @/totalDistance km
	genericTitle = Large Passenger flights to two sites
	group = KSP Air Service Transport
	agent = KSP Air Service
	description = Fly @/numPassengers KSP Air Service personnel from the @/baseIATAcode0 to @/baseFullName and a connecting flght to @/baseFullName2 in support of the @/fltReason project. Then return to the @/baseIATAcode0.
	genericDescription = Fly KSPAS personnel to their destination airports and then make a return to your base.
	synopsis = Fly KSPAS personnel to airports where KSP Air Service projects are ongoing.
	completedMessage = Flight Completed!&br;&br;Pretzels and Soda served: @/numSnacks&br;Air sickness bags used: @/numAirSickness&br;&br;Distance: @/totalDistance km&br;&br;KSP Air Service thanks you for flying and reminds you the sky is no longer the limit.

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Exceptional 
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 ) * 2
