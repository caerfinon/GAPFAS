// -----------------------------------------------------------------
//	CONTRACT:  GAPFAST03-TransportFlights3 - KSP Air Service - KSP Air Service - Passenger flights to Open bases
//	Author: Caerfinon 
// -----------------------------------------------------------------
CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFAST03
	name = GAPFAST03-TransportFlights3
	title = KSPAS Flight @/flightNumber - KSC to @GFAS:siteFullName.ElementAt(@/fltLocationSelection)
	genericTitle = Large Passenger flights to Open bases
	group = KSP Air Service Transport
	agent = KSP Air Service

	description = Fly passengers a to their destination airport and then make a return flight to the KSC
	genericDescription = Fly passengers a to their destination airport and then make a return flight to the KSC 
	synopsis = Fly passengers to an airport that KSP Air Service has existing landing rights at.
	completedMessage = Flight Completed!&br;&br;Pretzels and Soda served: @/numSnacks&br;Air sickness bags used: @/numAirSickness&br;&br;KSP Air Service thanks you for flying and reminds you the sky is no longer the limit.

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = (3 * @GFAS:rewardBaseValue) + (200 * @/numPassengers ) * Random(1.0, 1.15)
	rewardReputation = 1.0

//Contract Penalties
	failureFunds =  (@/rewardFunds * 1.15) * Random(1.0, 1.25)  
	failureReputation = 10 + ( @/numPassengers) 
	
// -----------------------------------------------------------------	
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAST02-TransportFlights2
		minCount = 5
		
	}
		
	// Checks for Groups.cfg Base Open override
	REQUIREMENT
	{
    name = Any
    type = Any	
	    // Checks Kerbal Konstructs Base status
		REQUIREMENT
		{
			name = DestinationBaseOpen
			type = BaseOpen
			basename = @/baseFullName
		}
		
		// Checks for Groups.cfg Base Open override
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Base Open Override 		
			expression = @/baseStatus == 0 
		}
	}
// -----------------------------------------------------------------
//DATA NODES TO PROCESS FOR CONTRACT USE
// -----------------------------------------------------------------

// Flight Destination 
	DATA
	{
		type = int
		fltLocationSelection = Random(@GFAS:siteComm2Start, @GFAS:siteComm2Stop)
	}
// Base name 
	DATA
	{
		type = string
		baseFullName = GFAS:@GFAS:siteFullName.ElementAt(@/fltLocationSelection)
		hidden = true
	}
	
// Base Status 
	DATA
	{
		type = double
		baseStatus = GFAS:baseCheck.ElementAt(@/fltLocationSelection)
		hidden = true
	}
// flightNumber
	DATA
	{
		type = string
		flightNumber = "KA" + @/fltLocationSelection + "D0"
		hidden = true
	}
//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		craft = "KSPASTransprotFlights" + @/flightNumber 
		uniquenessCheck = GROUP_ACTIVE
		hidden = true
	}
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
	DATA
	{
		type = string
		site2ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
	}

//Passenger Data
	DATA
	{
		type = int
		numPassengers = Random(12, 20)
	
	}
	
//Snacks
	DATA
	{
		type = double
		
		numSnacks = Round(@numPassengers * 1.05)
		numAirSickness = Round(Random( 0 , @numPassengers / 6))
		
	}
	

// -----------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// -----------------------------------------------------------------
//
	
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
        count = @/numPassengers  
		kerbalType = Applicant
		removePassengers = true
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
		}
		
		WAYPOINT
		{
			name = the Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = LaunchSite
			
		}

		WAYPOINT
		{
			name = @GFAS:siteName.ElementAt(@/fltLocationSelection)
			icon = GAPFAS/Assets/Icons/Airport
			altitude = 0
			latitude = @GFAS:siteLAT.ElementAt(@/fltLocationSelection)
			longitude = @GFAS:siteLON.ElementAt(@/fltLocationSelection)
			
		}
		
		WAYPOINT
		{
			name = the Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(@/fltLocationSelection)
			longitude = @GFAS:terminalLON.ElementAt(@/fltLocationSelection)
			parameter = RequestLandingSite2
			
		}
	}

// Mission Dialog boxes
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = LaunchSite
			position = CENTER
			
			TEXT
			{
				text = Trans Flight, you are cleared for depature and immediate take off. Fly safe.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingSite2
			
			position = CENTER
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal. Directions have been transmited to you.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site2ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffSite2
			
			position = CENTER
			
			TEXT
			{
				text = Trans Flight, you are cleared for departure. Please proceed to the runway for immediate takeoff  
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site2ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionAccomplished
			
			position = CENTER
			
			TEXT
			{
				text = Trans Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal. Directions have been transmited to you. Welcome back. 
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
// failed misssion dialog
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = Trans Flight, Are you there? please respond. Trans Flight, we've lost you on radar, do you copy? Are you declaring an emergency?.... and you were doing so well.
				fontSize = 20
				textColor = #B00B1E
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
	}


// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = Initialization
		type = VesselParameterGroup
		title = Your aircraft must meet all requirements
		define = @/craft
		completeInSequence = true
		dissassociateVesselsOnContractFailure = false 

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have two certified pilots
			trait = Pilot
			minCrew = 2
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a flight engineer
			trait = Engineer
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			category = Aero
			disableOnStateChange = false
			hideChildren = true
		}
		
		PARAMETER
		{
			name = HasCrewCapacity
			type = HasCrewCapacity
			title = have seating for passengers and crew
			minCapacity = @/numPassengers + 3
			disableOnStateChange = false
		}
		
		//Passenger Manifest - Load Passengers
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			title = load all @/numPassengers passengers
			count = @/numPassengers				
			hideChildren = true
		}
	}
	
//Launch Site
	PARAMETER
	{
		name = LaunchSite
		type = VesselParameterGroup
		title = begin at the KSC Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = false
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
		}
		
	}

	PARAMETER
	{
		name = RequestTakeoffLaunch
		type = Duration
		duration = 5s
		preWaitText = request clearance for takeoff:
		waitingText = requesting clearance for takeoff: 
		completionText = be cleared for takeoff
		completeInSequence = true
		disableOnStateChange = true
	}

// -----------------------------------------------------------------	
// Trip to Site2
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingSite2
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 2
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------
// Landing at Site2
// -----------------------------------------------------------------
	PARAMETER
	{
		name = LandingSite2
		type = VesselParameterGroup
		title = complete flight to the @GFAS:siteFullName.ElementAt(@/fltLocationSelection) runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true

		PARAMETER
		{
			name = Site2Terminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 3
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aricraft
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = TerminalrampSite2
			type = Duration
			
			duration = 10s
			preWaitText = wait for terminal ramp:
			waitingText = ramp being positioned: 
			completionText = ramp is in place begin deplaning  

			completeInSequence = true
			disableOnStateChange = false
		}
	}
		
	PARAMETER
	{
		name = All
		type = All
		title = complete passenger exchange
		disableOnStateChange = true
		completeInSequence = true
			
		PARAMETER
		{
			name = ReachState
			type = ReachState
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
			hidden = true
			completeInSequence = true
		}		
	
		PARAMETER
		{
			name = Duration
			type = Duration		
			duration = 30s
			preWaitText = wait to exchange passengers for:
			waitingText = exchanging passengers now:
			completionText = all passengers exchanged!
			startCriteria = PARAMETER_COMPLETION
			parameter = LandingSite2
		}		
	}
	
	PARAMETER
	{
		name = RequestTakeoffSite2
		type = Duration		
		duration = 5s
		preWaitText = request clearance for takeoff:
		waitingText = requesting clearance for takeoff: 
		completionText = be cleared for takeoff
		completeInSequence = true
		disableOnStateChange = true
	}
	
// -----------------------------------------------------------------
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingLaunch
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		title = complete flight to the KSC runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
			
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
			
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = TerminalrampKSC
			type = Duration
			
			duration = 10s
			preWaitText = wait for terminal ramp:
			waitingText = ramp being positioned: 
			completionText = ramp is in place begin deplaning  

			completeInSequence = true
			disableOnStateChange = false
		}
	}

	PARAMETER
	{
		name = All
		type = All
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}
	
//Recovery Parameter - Recover Kerbals
	PARAMETER
	{
        name = RecoverKerbal
        type = RecoverKerbal
		title = and recover all @/numPassengers passengers
        completeInSequence = true
		hideChildren = true
    }

// -----------------------------------------------------------------
// END OF CONTRACT
// -----------------------------------------------------------------
}



	



	