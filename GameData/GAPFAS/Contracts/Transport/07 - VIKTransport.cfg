// -----------------------------------------------------------------
//	CONTRACT:  GAPFAST07-VIK-Transport - KSP Air Service Transport - KSP Air Service - Transport a VIK between two airports safely
//	Author: Caerfinon 
//	Credits:
//	{
//		Original GAP: Author - inigma
//		Original Kerbin side GAP: Author - Keniamin 
//	}
// -----------------------------------------------------------------

CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFAST07
	name = GAPFAST07-VIK-Transport
	title = United Knations VIK Transport
	group = United Knations
	agent = United Knations

	description = Arrange travel for @/vikKerbalName from @KSPAS:siteFullName.ElementAt(@/srcSite) to @KSPAS:siteFullName.ElementAt(@/dstSite) so @/vikPronoun can @/dstSiteReasons.Random() for an important project. @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.  
	genericDescription = Arrange travel for an important Kerbal critical to the Space Program's ongoing projects 
	synopsis = Pick up the VIK from their current location and fly them to their destination. 
	notes = This mission requires the passenger to board the aircraft at the pick up location. Make sure there is a hatch and a ladder for them to use.    
	completedMessage = Thank you for transporting @/vikKerbalName to @KSPAS:siteFullName.ElementAt(@/dstSite) safely.

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Significant
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @KSPAS:rewardBaseValue * 4 * Random(1.0,1.15)
	rewardReputation = 5.0
	rewardScience = 0.0

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 15.0
	
// REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAST01-TransportFlights1
		minCount = 5
		
	}
	REQUIREMENT
	{
		title = Cool down timer 7 day
		name = CompleteContract
		type = CompleteContract
		minCount = 0
		contractType = GAPFASA-RareFlightScience
		cooldownDuration = 7d
	}
	
//DATA NODES TO PROCESS FOR CONTRACT USE
//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		craft = "KSPASVIKTransport" + @/vikKerbalName
		uniquenessCheck = GROUP_ACTIVE
		hidden = true
	}

// The VIK to pick up 

// Randomly select 0 (male) or 1 (female)
	DATA
	{
		type = int
		genderTypeVIK = Random(0,1)
	}

//create a bool for gender	
	DATA
    {
        type = bool
        isFemaleVIK = @/genderTypeVIK == 1
    }

	DATA
	{
		type = List<string>
		traitList = ["Pilot","Engineer","Scientist"]
		hidden = true
	}

	DATA
	{
		type = string
		vikKerbalName = RandomKerbalName(@/isFemaleVIK ? Female : Male)
		vikPronoun = @/isFemaleVIK ? "she" : "he"
		hidden = true
	}	
	
		
	DATA
	{
		type = List<Kerbal>
		kerbalVIK = [ NewKerbal( @/isFemale ? Female : Male, @/vikKerbalName , @/traitList.Random() ) ]
		hidden = true
		
	}
	
//Create Boffin-------------
    // Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	
	// Traits for Boffin - More Pilots
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Pilot","Engineer","Scientist"]
		hidden = true
	}
	
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
		
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}

// Source location of VIK
    // Exclude the Island Airfield as a source
// Flight Destination 
	DATA
	{
		type = int
		fltLocationSelection = Random(@GFAS:siteComm2Start, @GFAS:siteComm2Stop)
	}
// Base name 
	DATA
	{
		type = string
		baseFullName = @GFAS:siteFullName.ElementAt(@/fltLocationSelection)
		hidden = true
	}

// Base name 
	DATA
	{
		type = string
		baseIATAcode = @GFAS:siteName.ElementAt(@/fltLocationSelection)
		hidden = true
	}	

//  VIK's Destination
	DATA
	{
		type = int
		dstSiteTemp = Random(@GFAS:siteComm2Start + 1 , @GFAS:siteComm2Stop)
		// If the src and dst sites are identical, then make the destination the site index 1
		dstSite = @/dstSiteTemp == @/srcSite ?  1 : @/dstSiteTemp
	}


	DATA
	{
		type = List<string>
		hidden = true
		dstSiteReasons = ["maintain project continuity", "provide specialized on-site expertise", "maximize schedule efficiency", "respond to mission-critical issues", "ensure secure data transportation", "coordinate geographically dispersed project teams", "sustain operational continuity", "transport specialized project equipment", "minimize operational disruption" ]
	}
	
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site2ATCImage = @KSPAS:siteATC.ElementAt(@/srcSite) + @/ATCGender.Random()
		hidden = true
	}
	
	DATA
	{
		type = string
		site3ATCImage = @KSPAS:siteATC.ElementAt(@/dstSite) + @/ATCGender.Random()
		hidden = true
	}
	
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
	DATA
	{
		type = string
		site2ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
	}

//Text for name= in Air Terminals Waypoints
	DATA
	{
		type = string
		nameTerminalDst = @KSPAS:siteName.ElementAt(@/dstSite) + " Air Terminal"
		hidden = true
	}

//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// Waypoint to determine VIK pick up and drop off
	BEHAVIOUR
	{
        name = WaypointGenerator
        type = WaypointGenerator

		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
		}
		
		WAYPOINT
		{
			name = KSC Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
		}
		
		WAYPOINT
		{
			name = @KSPAS:siteName.ElementAt(@/srcSite) 
			targetBody = @/targetBody
			icon = ContractPacks/KerbinSideRemasteredGAP/Assets/Icons/Airport
			latitude = @KSPAS:siteLAT.ElementAt(@/srcSite)
			longitude = @KSPAS:siteLON.ElementAt(@/srcSite)
			altitude = 0
		}

		WAYPOINT
		{
			name = @/vikKerbalName
			icon = ContractPacks/KerbinSideRemasteredGAP/Assets/Icons/VIK 
			targetBody = @/targetBody
			latitude = @KSPAS:terminalLAT.ElementAt(@/srcSite)
			longitude = @KSPAS:terminalLON.ElementAt(@/srcSite)
			parameter = RequestLandingSite2
			altitude = 0
		}
		
		WAYPOINT
		{
			name = @KSPAS:siteName.ElementAt(@/dstSite) 
			targetBody = @/targetBody
			icon = ContractPacks/KerbinSideRemasteredGAP/Assets/Icons/Airport
			latitude = @KSPAS:siteLAT.ElementAt(@/dstSite)
			longitude = @KSPAS:siteLON.ElementAt(@/dstSite)
			altitude = 0
		}
				
		
		WAYPOINT
		{
			name = @/nameTerminalDst
			targetBody = @/targetBody
			icon = ContractPacks/KerbinSideRemasteredGAP/Assets/Icons/terminal
			latitude = @KSPAS:terminalLAT.ElementAt(@/dstSite)
			longitude = @KSPAS:terminalLAT.ElementAt(@/dstSite)
			parameter = RequestLandingSite3
			altitude = 0
		}		
    }
	
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Unowned
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
    }
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
    //Spawn the VIK
	BEHAVIOUR
	{
		name = SpawnKerbal
		type = SpawnKerbal

		KERBAL
		{
			kerbal = @/kerbalVIK.First()
			kerbalType = Unowned
			owned = false
			addToRoster = false
			lat = @KSPAS:TerminalLAT.ElementAt(@/srcSite)
			lon = @KSPAS:TerminalLON.ElementAt(@/srcSite)
			heading = 90

		}
	}

//Contract Dialogs	
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = LaunchSite
			position = CENTER
			
			TEXT
			{
				text = Thanks you so much for doing this on such short notice. The Secretary General will be happy to know our people are being well taken care of. You are cleared for depature and immediate take off.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = ContractPacks/KerbinSideRemasteredGAP/Assets/Characters/@/UKatc
				characterName = United Knations Liaison
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingSite2
			
			position = CENTER
			
			TEXT
			{
				text = Trans Flight, we have you on approach. You are cleared for landing. Your passenger is waiting at the terminal. Directions have been transmited to you.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = ContractPacks/KerbinSideRemasteredGAP/Assets/Characters/@/site2ATCImage
				characterName = Local Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = LandingSite2
			
			position = CENTER
			
			TEXT
			{
				text = Trans Flight, you are cleared for departure. Please proceed to the runway for immediate takeoff  
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = ContractPacks/KerbinSideRemasteredGAP/Assets/Characters/@/site2ATCImage
				characterName = Local Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingSite3
			
			position = CENTER
			
			TEXT
			{
				text = Trans Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal for passenger deplaning. Directions have been transmited to you.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = ContractPacks/KerbinSideRemasteredGAP/Assets/Characters/@/site3ATCImage
				characterName = Local Air Traffic Control
			}
			
		}

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = SafetyCheck
			position = CENTER
			title = <b>Wonderful News</b>
			textColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>The Secretay Genreal's office has been informed of your success. We would like to thank you for providing the resources necessary to make this flight happen.</color>    
			}
			
			IMAGE
			{
				url = ContractPacks/KerbinSideRemasteredGAP/Assets/Characters/@/UKatc
				characterName = United Knations Liaison
			}
			
		}

		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #FF0000
			
			TEXT
			{
				text = <color=#FF0000>We are very disappointed in by your recent set back. The Secretay Genreal's office has been informed of the incident.</color>    
			}
			
			IMAGE
			{
				url = ContractPacks/KerbinSideRemasteredGAP/Assets/Characters/@/UKatc
				characterName = United Knations Liaison
			}
			// Need a failure condition to remove the VIK
			BEHAVIOUR
			{
				name = RemoveKerbal
				type = RemoveKerbal

				kerbal = @/kerbalVIK
			}
			
		}		

	}

//PARAMETERS FOR CONTRACT COMPLETION
    //Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must meet mission requirements and goals
		dissassociateVesselsOnContractFailure = true
		define = @/craft
		completeInSequence = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			title = have the boffin on board
			kerbal = @/kerbalsBoffins.ElementAt(0) 
			disableOnStateChange = false
			hideChildren = true
		}
	
		PARAMETER
		{
			name = HasCrewCapacity
			type = HasCrewCapacity
			title = have seating for your crew and @/vikKerbalName
			minCapacity = 3
			disableOnStateChange = false
			
		}

	}
	
//Launch Site
	PARAMETER
	{
		name = LaunchSite
		type = VesselParameterGroup
		title = begin at the KSC Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true

		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = false
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = RequestTakeoffLaunch
			type = Duration
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
	}
	

	
// -----------------------------------------------------------------	
// Trip to VIK Pick up
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingSite2
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

//Navigate to waypoint requirement include landing to a complete stop
    //Contract Goals
	PARAMETER
	{
		name = LandingSite2
		type = VesselParameterGroup
		title = complete flight to @KSPAS:siteFullName.ElementAt(@/srcSite) runway
		notes = land and move to within 50 meters of the VIK
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true

		PARAMETER
		{
			name = Site2Terminal
			type = VisitWaypoint
			title = then taxi to @/vikKerbalName
			index = 1
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
	
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aricraft
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		
		PARAMETER
		{
			name = EmbarkVIP
			type = All
			title = Embark the VIK
			completeInSequence = true
			hideChildren = true
			
			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				minCrew = 3
				completeInSequence = true			
				disableOnStateChange = false
				hidden = true
				
			}
			
			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				completeInSequence = true				
				kerbal = @/kerbalVIK
				disableOnStateChange = false
				
			}
		}
	}
	
    PARAMETER
	{
		name = RequestTakeoffSite2
		type = VesselParameterGroup
		vessel = @/craft
		title = continue flight plan  
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = RequestTakeoff
			type = Duration
			startCriteria = PARAMETER_COMPLETION
			parameter = LandingSite2
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
    }


	
// -----------------------------------------------------------------	
// Trip to VIK Drop off
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingSite3
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 2
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

	PARAMETER
	{
		name = LandingSite3
		type = VesselParameterGroup
		title = complete flight to @KSPAS:siteFullName.ElementAt(@/dstSite) runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true

		PARAMETER
		{
			name = Site3Terminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 3
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}	
	}
//
// TBD Disembark and recover the VIK at the terminal	
//
// TBD Return to KSC
//
//Recovery Parameter - Does the Boffin Join the program?
	PARAMETER
	{
		name = BoffinCheckYes
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = The Boffin decides: I'm In! 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin signs up
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
	
	PARAMETER
	{
		name = BoffinCheckNegative
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = completionText = The Boffin decides: I prefer the Lab 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin reassigned to lab
			expression = @/boffinHireChance > @GFAS:boffinChoiceChance
		}
	}
	PARAMETER
	{
		name = MissionEnding
		type = VesselParameterGroup
		vessel = @/craft
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}

//Recovery Parameter
	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft
		completeInSequence = true
		hideChildren = true

	}
}
	



	
