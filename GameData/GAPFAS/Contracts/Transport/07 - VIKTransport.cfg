// -----------------------------------------------------------------
//	CONTRACT:  GAPFAST07-VIK-Transport - KSP Air Service Transport - KSP Air Service - Transport a VIK between two airports safely
//	Author: Caerfinon 
//	Credits:
//	{
//		Original GAP: Author - inigma
//		Original Kerbin side GAP: Author - Keniamin 
//	}
// -----------------------------------------------------------------

CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFAST07
	name = GAPFAST07-VIK-Transport
	title = KSPAS Flight @/flightNumber - @/baseIATAcode0 to @/baseFullName and @/baseFullName2
	genericTitle = VIK Transport flights
	group = KSP Air Service Transport
	agent = KSP Air Service

	description = Arrange travel for the VIK @/vikKerbalName from @/baseFullName to @/baseFullName2 so @/vikPronoun can @/dstSiteReasons.Random() for an important project. @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.  
	genericDescription = Arrange travel for an important Kerbal critical to the Space Program's ongoing projects 
	synopsis = Pick up the VIK from their current location and fly them to their destination. 
	notes = This mission requires the passenger to board the aircraft at the pick up location and leave the plane at the destination site. Make sure there is a hatch and a ladder for them to use.    
	completedMessage = Thank you for transporting @/vikKerbalName to @/baseFullName2 safely.

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Significant
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * 4 * Random(1.0,1.15)
	rewardReputation = 5.0
	rewardScience = 0.0

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 15.0
	
// REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAST01-TransportFlights1
		minCount = 5
		
	}
	REQUIREMENT
	{
		title = Cool down timer 7 day
		name = CompleteContract
		type = CompleteContract
		minCount = 0
		contractType = GAPFASA-RareFlightScience
		cooldownDuration = 7d
	}
	
//DATA NODES TO PROCESS FOR CONTRACT USE
//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		craft = "KSPASVIKTransport" + @/flightNumber
		uniquenessCheck = GROUP_ACTIVE
		hidden = true
	}

// The VIK to pick up 

// Randomly select 0 (male) or 1 (female)
	DATA
	{
		type = int
		genderTypeVIK = Random(0,1)
	}

//create a bool for gender	
	DATA
    {
        type = bool
        isFemaleVIK = @/genderTypeVIK == 1
    }

	DATA
	{
		type = List<string>
		traitList = ["Pilot","Engineer","Scientist"]
		hidden = true
	}

	DATA
	{
		type = string
		vikKerbalName = RandomKerbalName(@/isFemaleVIK ? Female : Male)
		vikPronoun = @/isFemaleVIK ? "she" : "he"
		hidden = true
	}	
	
		
	DATA
	{
		type = List<Kerbal>
		kerbalVIK = [ NewKerbal( @/isFemaleVIK ? Female : Male, @/vikKerbalName , @/traitList.Random() ) ]
		hidden = true
		
	}
	
//Create Boffin-------------
    // Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	
	// Traits for Boffin - More Pilots
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Pilot","Engineer","Scientist"]
		hidden = true
	}
	
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
		
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}

// Source location of VIK
    // Exclude the Island Airfield as a source
// Flight Destination 
	DATA
	{
		type = int
		srcSite = Random(@GFAS:siteComm2Start, @GFAS:siteComm2Stop)
	}
// Base name 
	DATA
	{
		type = string
		baseFullName = @GFAS:siteFullName.ElementAt(@/srcSite)
		hidden = true
	}

// Base name 
	DATA
	{
		type = string
		baseIATAcode0 = @GFAS:siteName.ElementAt(0)
		baseIATAcode = @GFAS:siteName.ElementAt(@/srcSite)
		hidden = true
	}	

// Base name 2
	DATA
	{
		type = string
		baseFullName2 = @GFAS:siteFullName.ElementAt(@/dstSite)
		hidden = true
	}

// Base name 2
	DATA
	{
		type = string
		baseIATAcode2 = @GFAS:siteName.ElementAt(@/dstSite)
		hidden = true
	}	

// flightNumber
	DATA
	{
		type = string
		flightNumber = "KA" + @/srcSite + "C" + @/dstSite + "VIK"
		hidden = true
	}

//  VIK's Destination
	DATA
	{
		type = int
		dstSiteTemp = Random(@GFAS:siteComm2Start + 1 , @GFAS:siteComm2Stop)
		// If the src and dst sites are identical, then make the destination the site index 1
		dstSite = @/dstSiteTemp == @/srcSite ?  1 : @/dstSiteTemp
	}


	DATA
	{
		type = List<string>
		hidden = true
		dstSiteReasons = ["maintain project continuity", "provide specialized on-site expertise", "maximize schedule efficiency", "respond to mission-critical issues", "ensure secure data transportation", "coordinate geographically dispersed project teams", "sustain operational continuity", "transport specialized project equipment", "minimize operational disruption" ]
	}
	
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
	DATA
	{
		type = string
		site2ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
	}
	
	DATA
	{
		type = string
		site3ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
	}

// -----------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// -----------------------------------------------------------------

	
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Unowned
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
    }
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
    //Spawn the VIK
	BEHAVIOUR
	{
		name = SpawnKerbal
		type = SpawnKerbal

		KERBAL
		{
			kerbal = @/kerbalVIK.ElementAt(0)
			kerbalType = Unowned
			owned = false
			addToRoster = false
			lat = @GFAS:terminalLAT.ElementAt(@/srcSite) + (Random(-99,99) / 100000)
			lon = @GFAS:terminalLON.ElementAt(@/srcSite)+ (Random(-99,99) / 100000)
			heading = Random(0,359)

		}
	}

// Waypoint to determine VIK pick up and drop off
	BEHAVIOUR
	{
        name = WaypointGenerator
        type = WaypointGenerator

		WAYPOINT
		{
			name = @/baseIATAcode0 + " Runway"
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @/targetBody
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
			parameter = RequestTakeoffSite3
		}
		
		WAYPOINT
		{
			name = @/baseIATAcode0 + " Air Terminal"
			icon = GAPFAS/Assets/Icons/terminal
			targetBody = @/targetBody
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLandingKSC
		}
		
		WAYPOINT
		{
			name = @GFAS:siteName.ElementAt(@/srcSite) + " Runway"
			targetBody = @/targetBody
			icon = GAPFAS/Assets/Icons/Airport
			latitude = @GFAS:siteLAT.ElementAt(@/srcSite)
			longitude = @GFAS:siteLON.ElementAt(@/srcSite)
			parameter = RequestTakeoffLaunch
			altitude = 0
		}

		WAYPOINT
		{
			name = @/vikKerbalName
			icon = GAPFAS/Assets/Icons/VIK 
			targetBody = @/targetBody
			latitude = @GFAS:terminalLAT.ElementAt(@/srcSite)
			longitude = @GFAS:terminalLON.ElementAt(@/srcSite)
			parameter = RequestLandingSite2
			altitude = 0
		}
		
		WAYPOINT
		{
			name = @GFAS:siteName.ElementAt(@/dstSite) + " Runway" 
			targetBody = @/targetBody
			icon = GAPFAS/Assets/Icons/Airport
			latitude = @GFAS:siteLAT.ElementAt(@/dstSite)
			longitude = @GFAS:siteLON.ElementAt(@/dstSite)
			parameter = RequestTakeoffSite2			
			altitude = 0
		}
				
		
		WAYPOINT
		{
			name = @GFAS:siteName.ElementAt(@/dstSite) + " Air Terminal"
			targetBody = @/targetBody
			icon = GAPFAS/Assets/Icons/terminal
			latitude = @GFAS:terminalLAT.ElementAt(@/dstSite)
			longitude = @GFAS:terminalLON.ElementAt(@/dstSite)
			parameter = RequestLandingSite3
			altitude = 0
		}		
	}

// Mission Dialog boxes
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffLaunch
			position = CENTER
			
			TEXT
			{
				text = Flight, you are cleared for depature and immediate take off. Your destination location has been marked for you. Fly safe.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingSite2
			
			position = CENTER
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. Your passenger is waiting at the terminal. Directions have been transmited to you.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site2ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffSite2
			
			position = CENTER
			
			TEXT
			{
				text = Flight, you are cleared for departure. Please proceed to the runway for immediate takeoff. Your destination location has been marked for you.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site2ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingSite3
			
			position = CENTER
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal for passenger deplaning. Directions have been transmited to you.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site3ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffSite3
			
			position = CENTER
			
			TEXT
			{
				text = Flight, you are cleared for departure. Please proceed to the runway for immediate takeoff. Your destination location has been marked for you.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site3ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingKSC

			position = CENTER
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal. Directions have been transmited to you. Welcome back.
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionEnding
			
			position = CENTER
			
			TEXT
			{
				text = Flight, your mission is complete. Recover your aircraft to the hanger. Good to have you back.    
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
// failed misssion dialog
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
   
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = Flight, Are you there? please respond. Flight, we've lost you on radar, do you copy? Are you declaring an emergency?.... and you were doing so well.
				fontSize = 20
				textColor = #B00B1E
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			// Need a failure condition to remove the VIK
			BEHAVIOUR
			{
				name = RemoveKerbal
				type = RemoveKerbal

				kerbal = @/kerbalVIK
			}
		}
	}

// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must meet all requirements
		define = @/craft
		completeInSequence = true
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			title = have the boffin on board
			kerbal = @/kerbalsBoffins.ElementAt(0) 
			disableOnStateChange = false
			hideChildren = true
		}
	
		PARAMETER
		{
			name = HasCrewCapacity
			type = HasCrewCapacity
			title = have seating for your crew and @/vikKerbalName
			minCapacity = 3
			disableOnStateChange = false
			
		}
	}
	
//Launch Site
	PARAMETER
	{
		name = MissionStart
		type = VesselParameterGroup
		title = begin at the @/baseIATAcode0 Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}
	PARAMETER
	{
		name = RequestTakeoffLaunch
		type = Duration
		duration = 5s
		preWaitText = request clearance for takeoff:
		waitingText = requesting clearance for takeoff: 
		completionText = be cleared for takeoff
		completeInSequence = true
		disableOnStateChange = true
	}
// -----------------------------------------------------------------	
// Trip to VIK Pick up
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingSite2
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 2
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------
// Landing at Site2
// -----------------------------------------------------------------
	PARAMETER
	{
		name = LandingSite2
		type = VesselParameterGroup
		title = complete flight to @GFAS:siteFullName.ElementAt(@/srcSite) runway
		notes = land and move to within 50 meters of the VIK
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true

		PARAMETER
		{
			name = Site2Terminal
			type = VisitWaypoint
			title = then taxi to @/vikKerbalName
			index = 3
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aricraft
			targetBody = @/targetBody
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = EmbarkVIP
			type = All
			title = Embark the VIK
			completeInSequence = true
			hideChildren = true
			
			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				minCrew = 3
				completeInSequence = true			
				disableOnStateChange = false
				hidden = true
				
			}
			
			PARAMETER
			{
				name = HasCrew
				type = HasCrew
				completeInSequence = true				
				kerbal = @/kerbalVIK
				disableOnStateChange = false
				
			}
		}
	}
	
	PARAMETER
	{
		name = RequestTakeoffSite2
		type = Duration		
		duration = 5s
		preWaitText = request clearance for takeoff:
		waitingText = requesting clearance for takeoff: 
		completionText = be cleared for takeoff
		completeInSequence = true
		disableOnStateChange = true
	}
	
// -----------------------------------------------------------------	
// Trip to VIK Drop off
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingSite3
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 4
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------
// Landing at Site3
// -----------------------------------------------------------------
	PARAMETER
	{
		name = LandingSite3
		type = VesselParameterGroup
		title = complete flight to @GFAS:siteFullName.ElementAt(@/dstSite) runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true

		PARAMETER
		{
			name = Site3Terminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 5
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = @/targetBody
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
	}
//Remove VIK at Destination
	PARAMETER
	{
		name = Not
		type = Not
		title = Have @/vikKerbalName leave the aircraft and stay at the destination terminal 
		hideChildren = true
		completeInSequence = true
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			completeInSequence = true				
			kerbal = @/kerbalVIK
			disableOnStateChange = false
		}
	}
	
	PARAMETER
	{
		name = RequestTakeoffSite3
		type = Duration		
		duration = 5s
		preWaitText = request clearance for takeoff:
		waitingText = requesting clearance for takeoff: 
		completionText = be cleared for takeoff
		completeInSequence = true
		disableOnStateChange = true
	}
	
	
// -----------------------------------------------------------------
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingKSC
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------


	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		title = complete flight to the @/baseIATAcode0 runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = @GFAS:whereAreWe
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
	}
//Recovery Parameter - Does the Boffin Join the program?
	PARAMETER
	{
		name = BoffinCheckYes
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I'm In! 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin signs up
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
	
	PARAMETER
