// -----------------------------------------------------------------
//	CONTRACT:  GAPFAST01-TransportFlights1 - KSP Air Service Transport - KSP Air Service - Passenger flights to Multi bases
//	Author: Caerfinon 
// -----------------------------------------------------------------
CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFAST04
	name = GAPFAST04-TransportMultiFlights1
	title = KSPAS Flight @/flightNumber - KSC to @/baseIATAcode - @/baseFullName and @/baseIATAcode2 - @/baseFullName2
	genericTitle = Small Transport flights
	group = KSP Air Service Transport
	agent = KSP Air Service
	description = Fly @/numPassengers KSP Air Service personnel from the KSC to airport @/baseIATAcode at @/baseFullName and a connecting flght to @/baseIATAcode2 at @/baseFullName2 in support of the @/fltReason project. Then return to the KSC.
	genericDescription = Fly KSPAS personnel to their destination airports and then make a return flight to the KSC 
	synopsis = Fly KSPAS personnel to airports where KSP Air Service projects are ongoing.
	completedMessage = Flight Completed!&br;&br;Pretzels and Soda served: @/numSnacks&br;Air sickness bags used: @/numAirSickness&br;&br;KSP Air Service thanks you for flying and reminds you the sky is no longer the limit.

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 ) * 2
	rewardFunds = (1 * @GFAS:rewardBaseValue) + (200 * @/numPassengers ) * Random(1.0, 1.15) * 2
	rewardReputation = 1.0 * 2

//Contract Penalties
	failureFunds =  (@/rewardFunds * 1.15) * Random(1.0, 1.25) * 2
	failureReputation = 10 + ( @/numPassengers) * 2
	
// -----------------------------------------------------------------	
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAST01-TransportFlights1
		minCount = 2
		
	}
// -----------------------------------------------------------------
//DATA NODES TO PROCESS FOR CONTRACT USE
// -----------------------------------------------------------------

// Flight Destination 
	DATA
	{
		type = int
		fltLocationSelection = Random(@GFAS:siteComm2Start, @GFAS:siteComm2Stop)
	}
	
// Connecting Flight Destination 
	DATA
	{
		type = int
		fltLocationSelection2 = @GFAS:siteMultiFlight.ElementAt(@/fltLocationSelection)
	}	
	
// Base name
	DATA
	{
		type = string
		baseFullName = @GFAS:siteFullName.ElementAt(@/fltLocationSelection)
		hidden = true
	}

// Base name 
	DATA
	{
		type = string
		baseIATAcode = @GFAS:siteName.ElementAt(@/fltLocationSelection)
		hidden = true
	}	

// Base name 2
	DATA
	{
		type = string
		baseFullName2 = @GFAS:siteFullName.ElementAt(@/fltLocationSelection2)
		hidden = true
	}

// Base name 2
	DATA
	{
		type = string
		baseIATAcode2 = @GFAS:siteName.ElementAt(@/fltLocationSelection2)
		hidden = true
	}	

// flightNumber
	DATA
	{
		type = string
		flightNumber = "KA" + @/fltLocationSelection + "C" + @/fltLocationSelection2
		hidden = true
	}
//Flight Reason

	DATA
	{
		type = List<string>
		hidden = true
		fltReasons = ["Geological Home World Mapping", "Hyperspectral Microwave Sensor Intensive Experiment", "Arctic Radiation Cloud Aerosol Surface Interacting Experiment","Atmospheric Tomography Mission","Airborne Surface Water and Ocean Topography","Airborne Tropical Tropopause Experiment","Hurricane and Severe Storm Sentinel" ]
	}
	
	DATA
	{
		type = string
		hidden = true
		fltReason = @/fltReasons.Random()
	}

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		craft = "KSPASTransprotFlights" + @/flightNumber 
		uniquenessCheck = GROUP_ACTIVE
		hidden = true
	}
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
	DATA
	{
		type = string
		site2ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
	}
	DATA
	{
		type = string
		site3ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
	}

//Passenger Data
	DATA
	{
		type = int
		numPassengers = Random(4, 8)
	}
	DATA
	{
		type = List<string>
		traitList = ["Pilot","Engineer","Scientist"]
		hidden = true
	}	
	DATA
	{
		type = List<Kerbal>
		passengers = [ NewKerbalWithTrait(@/traitList.Random()),NewKerbalWithTrait(@/traitList.Random()),NewKerbalWithTrait(@/traitList.Random()),NewKerbalWithTrait(@/traitList.Random()),NewKerbalWithTrait(@/traitList.Random()),NewKerbalWithTrait(@/traitList.Random()),NewKerbalWithTrait(@/traitList.Random()),NewKerbalWithTrait(@/traitList.Random())]
		hidden = true 
		
	}
	DATA
	{
		type = List<Kerbal>
		kerbals = @passengers.Random(@numPassengers)
		hidden = true
	}

//Snacks
	DATA
	{
		type = double
		
		numSnacks = Round(@numPassengers * 1.05)
		numAirSickness = Round(Random( 0 , @numPassengers / 6))
		
	}
	

// -----------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// -----------------------------------------------------------------
//
	
	BEHAVIOUR
	{
        name = SpawnPassengers
        type = SpawnPassengers
		kerbal = @/kerbals
		kerbalType = Unowned
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
			parameter = RequestTakeoffSite3
		}
		
		WAYPOINT
		{
			name = KSC Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLandingKSC
			
		}

		WAYPOINT
		{
			name = @GFAS:siteName.ElementAt(@/fltLocationSelection) + " Runway"
			icon = GAPFAS/Assets/Icons/Airport
			altitude = 0
			latitude = @GFAS:siteLAT.ElementAt(@/fltLocationSelection)
			longitude = @GFAS:siteLON.ElementAt(@/fltLocationSelection)
			parameter = RequestTakeoffLaunch
		}
		
		WAYPOINT
		{
			name = @GFAS:siteName.ElementAt(@/fltLocationSelection) + " Air Terminal"
			icon = GAPFAS/Assets/Icons/terminal
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(@/fltLocationSelection)
			longitude = @GFAS:terminalLON.ElementAt(@/fltLocationSelection)
			parameter = RequestLandingSite2
		}
		
		WAYPOINT
		{
			name = @GFAS:siteName.ElementAt(@/fltLocationSelection2) + " Runway"
			icon = GAPFAS/Assets/Icons/Airport
			altitude = 0
			latitude = @GFAS:siteLAT.ElementAt(@/fltLocationSelection2)
			longitude = @GFAS:siteLON.ElementAt(@/fltLocationSelection2)
			parameter = RequestTakeoffSite2
		}
		
		WAYPOINT
		{
			name =  @GFAS:siteName.ElementAt(@/fltLocationSelection2) + " Air Terminal"
			icon = GAPFAS/Assets/Icons/terminal
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(@/fltLocationSelection2)
			longitude = @GFAS:terminalLON.ElementAt(@/fltLocationSelection2)
			parameter = RequestLandingSite3
		}
	}

