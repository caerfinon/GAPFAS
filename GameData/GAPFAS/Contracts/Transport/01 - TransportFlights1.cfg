	sortKey = GAPFAST01
	name = GAPFAST01-TransportFlights1
	title = KSPAS Flight @/flightNumber - @/baseIATAcode0 to @/baseFullName - Total Distance: @/totalDistance km
	genericTitle = Small Transport flights
	group = KSP Air Service Transport
	agent = KSP Air Service

	description = Fly @/numPassengers KSP Air Service personnel from the @/baseIATAcode0 to @/baseFullName in support of the @/fltReason project. After exchanging passengers make a return flight to the @/baseIATAcode0.
	genericDescription = Fly KSPAS personnel to their destination airports and then make a return to your base
	synopsis = Fly KSPAS personnel to an airport where KSP Air Service projects are ongoing.
	completedMessage = Flight Completed!&br;&br;Pretzels and Soda served: @/numSnacks&br;Air sickness bags used: @/numAirSickness&br;&br;Distance: @/totalDistance km&br;&br;KSP Air Service thanks you for flying and reminds you the sky is no longer the limit.

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 2
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = ((2 * @GFAS:rewardBaseValue) + @/totalDistance + (200 * @/numPassengers )) * Random(1.0, 1.15)
	rewardReputation = 1.0

//Contract Penalties
	failureFunds =  (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 10 + ( @/numPassengers) 
	
