	DATA
	{
		type = string
		flightNumber = "KA" + @/fltLocationSelection
		hidden = true
	}
	
//---------------------------------------------------------------
// Single Site Math Package 
//---------------------------------------------------------------
	DATA
	{
		type = double
		hidden = true

        // Inputs from Group Level data
        // Flight locations KSC, to randomly selected airport 
        lat0 = @GFAS:siteLAT.ElementAt(0)
        lon0 = @GFAS:siteLON.ElementAt(0)
		lat1 = @GFAS:siteLAT.ElementAt(@/fltLocationSelection)
        lon1 = @GFAS:siteLON.ElementAt(@/fltLocationSelection)
		
		// Location Radian values 
		lat0Rad = @/lat0 * @/PI / 180.0
		lon0Rad = @/lon0 * @/PI / 180.0
		lat1Rad = @/lat1 * @/PI / 180.0

		//Trip Radians
		dLat1 = (@/lat1 - @/lat0) * @/PI / 180.0
        dLon1 = (@/lon1 - @/lon0) * @/PI / 180.0
        
        // Constants
        PI = 3.141592653589793
		radius = @GFAS:whereAreWe.Radius() // in meters
		
	//-----------------------------------------------------------------------------------------	
	// Trip 1 and return 
	//-----------------------------------------------------------------------------------------	
		//--------------------------
		// Distance Calculations
		//--------------------------

        // Multi-step haversine calculation  KSC to Site 1
        a1 = Pow(Sin(@/dLat1 / 2.0), 2) + Pow(Sin(@/dLon1 / 2.0), 2) * Cos(@/lat0Rad) * Cos(@/lat1Rad)
        c1 = 2.0 * Asin(Pow(@/a1, 0.5))
		
		// final result (meters)
        d1 = @/radius * @/c1

		//--------------------------
		// Heading Calculations
		//--------------------------

		// Multi-step heading calculation  KSC to Site 1
		y1 = Sin(@/dLon1) * Cos(@/lat1Rad)
		x1 = Cos(@/lat0Rad) * Sin(@/lat1Rad) - Sin(@/lat0Rad) * Cos(@/lat1Rad) * Cos(@/dLon1)
		theta1 = @/x1 == 0 ? (@/y1 >= 0 ? 90.0 : 270.0) : (@/x1 < 0 ? (Atan(@/y1 / @/x1) * 180.0 / @/PI + 180.0) : (Atan(@/y1 / @/x1) * 180.0 / @/PI))
		
		//-----------------------------------------------------------------------------------------	
		// Convert heading to degrees and reverse
		//-----------------------------------------------------------------------------------------	
		heading1 = @/theta1 < 0 ? Round(@/theta1 + 360.0) : Round(@/theta1)
		heading1R = @/heading1 >= 180 ? @/heading1 - 180 : @/heading1 + 180.0 // for single dest flights the return heading is the reverse of the original heading	
	
	}	
	
	//-----------------------------------------------------------------------------------------	
	// Normalize Distance to km
	//-----------------------------------------------------------------------------------------	
	
	DATA
	{
		type = int
		hidden = true
		// Convert to integer and km 
		distance1 = int(@/d1) / 1000
		totalDistance = @/distance1 * 2 
		
	}
//---------------------------------------------------------------
// Math Package end
//---------------------------------------------------------------

