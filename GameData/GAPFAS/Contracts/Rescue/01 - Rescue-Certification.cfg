CONTRACT_TYPE
{
    //CONTRACT DESCRIPTION
	sortKey = GAPFASR1
	name = GAPFASR01-Rescue-Certification1rtification1
	title = Navy Certification Test 1
	group = United Knations Navy
	agent = United Knations Navy

	description = The Navy is stretched a little thin these days and is actively recruiting off-duty KSC staff to join the Naval Auxiliary Reserve. Duties would involve flying patrols and conducting air-sea rescue operations around the Naval Air Stations world wide.\n\nTo qualify, certification tests need to be passed to ensure that you will be able to perform the necessary duties.  
	
	synopsis = Come Join the Navy - A global force for good. 

	notes = This Certification is for aircraft that can rescue a kerbal at sea. You can use a seplane, a helicopter or other VTOL craft. Once you have the lost pilot, return to the KSC. Extra rewards for landing on the VAB helipad.

	completedMessage = Navy Certification Mission Completed! Your organization is now certified to accept Navy Air/Sea rescue and retrieval contracts.

    //Contract Limits
	maxCompletions = 1
	maxSimultaneous = 1
    //weight = 10.0

	autoAccept = false
	declinable = true
	cancellable = true

	minExpiry = 0.0
	maxExpiry = 0.0
	deadline = 0

    //Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
    //Contract Rewards
	rewardFunds = @GFAS:rewardBaseValue
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardReputation = 1
    rewardScience = 0

    //Contract Penalties
	failureFunds = (@/rewardFunds * 1.15)
 	failureReputation = 10


//REQUIREMENTS FOR CONTRACT TO APPEAR


	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAS2-Speed220
		minCount = 1
		
	}


//DATA NODES TO PROCESS FOR CONTRACT USE

    //Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		craft = GAPFASR-Rescue-Certification1
		
	}
	
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
	
//Create Boffin-------------
	// Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	// Traits for Boffin - More Pilots
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Pilot","Engineer","Scientist"]
		hidden = true
	}
	
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true	
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}
	
    //Crash Location Location Pulled from Waypoint Generator Behaviour
	
	DATA
	{
		type = Waypoint
		hidden = true
		crashWaypoint = @/CrashWaypointGenerator.Waypoints().ElementAt(2)
	}

	DATA
	{
		type = Location
		hidden = true
		crashLocation = @/crashWaypoint.Location()
	}


//BEHAVIOURS TO DO WHEN CREATING CONTRACT
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Unowned
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
    }
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
	
    //Generate Sea Zones and Define Random Waypoints
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		
		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @/targetBody
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
			parameter = MissionGoalTest2
		}
		
		WAYPOINT
		{
			name = KSC Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			targetBody =  @/targetBody
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLandingKSC
		}
		
		//Mayday Random Waypoint near KSC Runway
	    RANDOM_WAYPOINT_NEAR
		{
		
			name = Test Site 1
			icon = GAPFAS/Assets/Icons//Rescue
			targetBody =  @/targetBody
			nearIndex = 0
			maxDistance = 80000.0
			minDistance = 15000.0
			waterAllowed = false
			altitude = 0.0		
		}

	    RANDOM_WAYPOINT_NEAR
		{
		
			name = Test Site 2
			icon = GAPFAS/Assets/Icons//Rescue
			targetBody =  @/targetBody
			nearIndex = 0
			maxDistance = 80000.0
			minDistance = 15000.0
			underwater = true
			altitude = -0.1
		}		
		
	}
	
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffLaunch
			
			position = CENTER
			title = <b>Take Off</b>
			titleColor = #BADA55
			TEXT
			{
				text = <color=#BADA55>Flight, you are cleared to beging the certification test. First maintain a fixed hovering position. Good hunting.</color> 
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoalTest1
			
			position = CENTER
			title = <b>Mayday Search Area</b>
			titleColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, You have completed the hover test. Well done. Continue to the ground landing test location and land near the waypoint</color>  
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoalTest2
			
			position = CENTER
			title = <b>Mayday Search Area</b>
			titleColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, You have completed the ground landing test. Well done. Lift off and proceed to the water landing test location and land near the waypoint </color>  
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoalTest3
			
			position = CENTER
			title = <b>Mayday Search Area</b>
			titleColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, You have completed the water landing test. Huzzah!. Lift off and Return to the KSC.</color>  
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}		

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionEnding
			position = CENTER
			title = <b>Land At The KSC</b>
			titleColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, Excellent job. Now go get dried off before mission debriefing.</color>
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}

		}
		
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = <color=#B00B1E>Fight, Mission scrubed! Repeat. Mission has been scrubed.... and you were doing so well.</color>    
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}		

	}


// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			title = have the boffin on board
			kerbal = @/kerbalsBoffins.ElementAt(0) 
			disableOnStateChange = false
			hideChildren = true
		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			category = Aero
			disableOnStateChange = false
			hideChildren = true
		}
		
		PARAMETER
		{
			name = All
			type = All
			title = have an air breathing engine only
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket engines

				NONE
				{
					MODULE
					{
						EngineType = SolidBooster	
					}	
				}
				disableOnStateChange = false
				hideChildren = true
			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any liquid rocket engines
				NONE
				{
					MODULE
					{
						EngineType = LiquidFuel
					}	
				}	
				disableOnStateChange = false
				hideChildren = true
			}
			
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any solid rocket fuel
				resource = SolidFuel				
				minQuantity = 0.0
				maxQuantity = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any oxidizer
				resource = Oxidizer				
				minQuantity = 0.0
				maxQuantity = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			disableOnStateChange = false
		}
	}
	
//Launch Site
	PARAMETER
	{
		name = MissionStart
		type = VesselParameterGroup
		title = begin at the KSC Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = RequestTakeoffLaunch
			type = Duration
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
	}

// -----------------------------------------------------------------	
// Contract Goals
// -----------------------------------------------------------------
	
	// Hover Test
	PARAMETER
	{
		name = MissionGoalTest1
		type = All
		title = achieve a fixed hoving state
		completeInSequence = true
		disableOnStateChange = true
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = hover between 1000m and 1500m
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody =  @/targetBody
				situation = FLYING
				minAltitude = 1000
				maxAltitude = 1500
				disableOnStateChange = false
				hideChildren = true
				hidden = true
			}
		}
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = hold your speed to less than 1 m/s
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody =  @/targetBody
				situation = FLYING
				minSpeed = 0
                maxspeed = 1
				disableOnStateChange = false
				hideChildren = true
				hidden = true
			}
		}

		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = with less than 1 m/s of vertical speed
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				targetBody =  @/targetBody
				situation = FLYING
				minRateOfClimb = -1
				maxRateOfClimb = 1
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		}

		PARAMETER
		{
			name = Duration
			type = Duration
			
			duration = 10s
			preWaitText = and hold for:
			waitingText = and hold for: 
			completionText = You did it!

			completeInSequence = true
			disableOnStateChange = false			
			
		}
	}
	
	// Ground Landing
	PARAMETER
	{
		name = MissionGoalTest2
		type = VesselParameterGroup
		title = Fly to the ground landing test location
		notes = land within 50 meters of the waypoint
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true

		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			title = land near the waypoint 
			index = 2
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aricraft
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			
			duration = 10s
			preWaitText = Hold position on the ground:
			waitingText = remain landed: 
			completionText = Landing ground test complete  

			completeInSequence = true
			disableOnStateChange = false
		}
	}


	// Water Landing
	PARAMETER
	{
		name = MissionGoalTest3
		type = VesselParameterGroup
		title = Fly to the water landing test location
		notes = land within 50 meters of the waypoint
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true

		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			title = land near the waypoint 
			index = 3
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aricraft
			targetBody = Kerbin
			situation = SPLASHED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			
			duration = 10s
			preWaitText = Hold position on the water:
			waitingText = remain spashed down: 
			completionText = Landing water test complete  

			completeInSequence = true
			disableOnStateChange = false
		}
	}
	
// -----------------------------------------------------------------
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingKSC
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------


	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		title = complete flight to the KSC runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody =  @/targetBody
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
	}
//Recovery Parameter - Does the Boffin Join the program?
	PARAMETER
	{
		name = BoffinCheckYes
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I'm In! 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin signs up
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
	
	PARAMETER
	{
		name = BoffinCheckNegative
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I prefer the Lab 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin reassigned to lab
			expression = @/boffinHireChance > @GFAS:boffinChoiceChance
		}
	}
	PARAMETER
	{
		name = MissionEnding
		type = VesselParameterGroup
		vessel = @/craft
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}

//Recovery Parameter
	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft
		completeInSequence = true
		hideChildren = true

	}
// -----------------------------------------------------------------
// END OF CONTRACT
