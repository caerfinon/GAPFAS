// -----------------------------------------------------------------

CONTRACT_TYPE
{
    //CONTRACT DESCRIPTION
	sortKey = GAPFASR01
	name = GAPFASR01-Rescue-Certification
	title = Rescue Certification Test
    genericTitle = Rescue Certification Test 
	group = KSP Air Service Rescue
	agent = KSP Air Service 

	description = Gene Kerman wants to create an Operations Rescue Group in the KSP Air Service. With all these air missions being flown with an increasing number of aircraft and accident or two is bound to happen.\n\nTo qualify, certification tests need to be passed to ensure that you will be able to perform the necessary duties, and that aircraft capable of precise land and water landings are deployed. @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.      
	genericDescription = Certification tests need to be passed to ensure that you will be able to perform the necessary duties, and that aircraft capable of precise land and water landings are deployed.
	synopsis = Perfom hover, ground landing and water landing tests to certify that you are able to meet the requirements for air sea rescue operations 
	notes = This certification is for aircraft that can rescue a kerbal at from land or sea situations. You can use a seplane, a helicopter or other VTOL craft.
	completedMessage = Rescue Certification Mission Completed! You are now clear to accept Air/Sea rescue and retrieval contracts.

//Contract Limits
	maxCompletions = 1
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 0.0
	maxExpiry = 0.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * Random(1.0,1.15)
	rewardReputation = 1
	rewardScience = 0

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15)
	failureReputation = 10
	
// -----------------------------------------------------------------
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAS2-Speed220
		minCount = 1
	}


//------------------------------------------------------------------------
//DATA NODES TO PROCESS FOR CONTRACT USE
//------------------------------------------------------------------------
//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		craft = GAPFASR-Rescue-Certification1

		hidden = true
	}
// Base name 
	DATA
	{
		type = string
		baseIATAcode0 = @GFAS:siteName.ElementAt(0) 
		hidden = true
	}
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
//Create Boffin-------------
	// Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	// Traits for Boffin - More Pilots
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Pilot","Engineer","Scientist"]
		hidden = true
	}
	
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}

//------------------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
//------------------------------------------------------------------------
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Unowned
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
    }
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		
		WAYPOINT
		{
			name = @/baseIATAcode0 + "Runway"
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @/targetBody
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
			parameter = MissionGoalTest2
		}
		
		WAYPOINT
		{
			name = @/baseIATAcode0 + "Air Terminal"
			icon = GAPFAS/Assets/Icons/terminal
			targetBody =  @/targetBody
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLandingKSC
		}
		
		//Random Waypoint near KSC Runway
		RANDOM_WAYPOINT_NEAR
		{
		
			name = Test Site 1
			icon = GAPFAS/Assets/Icons/Patrol
			targetBody =  @/targetBody
			nearIndex = 0
			maxDistance = 150000.0
			minDistance = 900000.0
			waterAllowed = false
			altitude = 0.0		
		}
		
		//Random Waypoint near KSC Runway
	    RANDOM_WAYPOINT_NEAR
		{
		
			name = Test Site 2
			icon = GAPFAS/Assets/Icons/Patrol
			targetBody =  @/targetBody
			nearIndex = 0
			maxDistance = 150000.0
			minDistance = 900000.0
			underwater = true
			altitude = -0.1
		}
		
	}
//Contract Dialogs	
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffLaunch
			
			position = CENTER
			title = <b>Take Off</b>
			titleColor = #BADA55
			TEXT
			{
				text = <color=#BADA55>Flight, you are cleared to begin the certification test. First maintain a fixed hovering position. Good hunting.</color> 
			}
			
			INSTRUCTOR
			{
				name = Instructor_Gene
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoalTest1
			
			position = CENTER
			title = <b>Mayday Search Area</b>
			titleColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, You have completed the hover test. Well done. Continue to the ground landing test location and land near the waypoint</color>  
			}
			
			INSTRUCTOR
			{
				name = Instructor_Gene
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoalTest2
			
			position = CENTER
			title = <b>Mayday Ground Area</b>
			titleColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, You have completed the ground landing test. Well done. Lift off and proceed to the water landing test location and land near the waypoint </color>  
			}
			
			INSTRUCTOR
			{
				name = Instructor_Gene
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoalTest3
			
			position = CENTER
			title = <b>Mayday Water Area</b>
			titleColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, You have completed the water landing test. Huzzah!. Lift off and Return to base.</color>  
			}
			
			INSTRUCTOR
			{
				name = Instructor_Gene
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}
		}

//------------------------------------------------------------------------
// Mission completed dialog	
//------------------------------------------------------------------------
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionEnding
			position = CENTER
			title = <b>Return to Base</b>
			titleColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, Excellent job. Now go get dried off before mission debriefing.</color>
			}
			
			INSTRUCTOR
			{
				name = Instructor_Gene
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}

		}
		
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = <color=#B00B1E>Fight, Mission scrubed! Repeat. Mission has been scrubed.... and you were doing so well.</color>    
			}
			
			INSTRUCTOR
			{
				name = Instructor_Gene
				showName = true
				textColor = #B00B1E
				animation = false_sadA
			}
		}

	}

// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		define = @/craft
		dissassociateVesselsOnContractCompletion = true
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			title = have the boffin on board
			kerbal = @/kerbalsBoffins.ElementAt(0) 
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			category = Aero
			disableOnStateChange = false
			hideChildren = true
		}
		
		PARAMETER
		{
			name = All
			type = All
			title = have an air breathing engine only		
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket engines

				NONE
				{
					MODULE
					{
						EngineType = SolidBooster	
					}	
				}
				disableOnStateChange = false
				hideChildren = true
			}
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any liquid rocket engines
				NONE
				{
					MODULE
					{
						EngineType = LiquidFuel
					}	
				}	
				disableOnStateChange = false
				hideChildren = true
			}		
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any solid rocket fuel
				resource = SolidFuel				
				minQuantity = 0.0
				maxQuantity = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any oxidizer
				resource = Oxidizer				
				minQuantity = 0.0
				maxQuantity = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			disableOnStateChange = false
		}
	}
//Launch Site
	PARAMETER
	{
		name = MissionStart
		type = VesselParameterGroup
		title = begin at the @/baseIATAcode0 Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = RequestTakeoffLaunch
			type = Duration
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
	}
// -----------------------------------------------------------------	
// Contract Goals
// -----------------------------------------------------------------
	
	// Hover Test
	PARAMETER
	{
		name = MissionGoalTest1
		type = All
		title = achieve a fixed hovering state
		completeInSequence = true
		disableOnStateChange = true
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = hover at an altitude between 1000m and 1500m
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody =  @/targetBody
				situation = FLYING
				minAltitude = 1000
				maxAltitude = 1500
				disableOnStateChange = false
				hideChildren = true
				hidden = true
			}
		}
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = hold your speed to less than 1 m/s
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody =  @/targetBody
				situation = FLYING
				minSpeed = 0
                maxSpeed = 1
				disableOnStateChange = false
				hideChildren = true
				hidden = true
			}
		}

		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = with less than 1 m/s of vertical speed
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				targetBody =  @/targetBody
				situation = FLYING
				minRateOfClimb = -1
				maxRateOfClimb = 1
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			
			duration = 10s
			preWaitText = and hold for:
			waitingText = and hold for: 
			completionText = You did it!

			completeInSequence = true
			disableOnStateChange = false			
			
		}
	}
	
	// Ground Landing
	PARAMETER
	{
		name = MissionGoalTest2
		type = VesselParameterGroup
		title = Fly to the ground landing test location
		notes = land within 50 meters of the waypoint
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			title = land near the waypoint 
			index = 2
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aricraft
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			
			duration = 10s
			preWaitText = Hold position on the ground:
			waitingText = remain landed: 
			completionText = Landing ground test complete  

			completeInSequence = true
			disableOnStateChange = false
		}
	}

	// Water Landing
	PARAMETER
	{
		name = MissionGoalTest3
		type = VesselParameterGroup
		title = Fly to the water landing test location
		notes = land within 50 meters of the waypoint
		vessel = @/craft
		disableOnStateChange = true
		hideVesselName = true
		completeInSequence = true

		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			title = land near the waypoint 
			index = 3
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aricraft
			targetBody = Kerbin
			situation = SPLASHED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = Duration
			type = Duration
			
			duration = 10s
			preWaitText = Hold position on the water:
			waitingText = remain spashed down: 
			completionText = Landing water test complete  

			completeInSequence = true
			disableOnStateChange = false
		}
	}
// -----------------------------------------------------------------
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingKSC
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------


	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		title = complete flight to the @/baseIATAcode0 runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody =  @/targetBody
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
	}
//Recovery Parameter - Does the Boffin Join the program?
	PARAMETER
	{
		name = BoffinCheckYes
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I'm In! 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin signs up
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
	
	PARAMETER
	{
		name = BoffinCheckNegative
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I prefer the Lab 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin reassigned to lab
			expression = @/boffinHireChance > @GFAS:boffinChoiceChance
		}
	}
	PARAMETER
	{
		name = MissionEnding
		type = VesselParameterGroup
		vessel = @/craft
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}

//Recovery Parameter
	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft
		completeInSequence = true
		hideChildren = true
	}
// -----------------------------------------------------------------
// END OF CONTRACT
// -----------------------------------------------------------------
}