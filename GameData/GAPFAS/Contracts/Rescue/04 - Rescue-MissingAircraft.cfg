// -----------------------------------------------------------------
//	CONTRACT:  GAPFASR04-MissingAircraft - KSP Air Service - KSP Air Service Rescue - Rescue a downed Pilot and recover the aircraft's Black Box
//	Author: Caerfinon 
//	Credits:
//	{
//		Original GAP: Author - inigma
//		Original Kerbin side GAP: Author - Keniamin 
//	}
// -----------------------------------------------------------------

CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFASR04
	name = GAPFASR04-MissingAircraft
	title = United Knations Missing Aircraft
	group = KSP Air Service Rescue
	agent = KSP Air Service

	description = One of our aircraft is missing in @/crashBiome.FullName()! The pilot last reported they had suffered @/crashReason and then we lost contact. The United Knations want's us to fly to the crash site to recover any information we can. @/agentKerbalName from the KAA will be travelling with you to observe the operation.
	genericDescription =  One of our aircraft is missing ! The pilot reported the position and then we lost contact. The United Knations want's us to fly to the crash site to recover any information we can. 
	synopsis = There has been a plane crash. Travel to the site and recover any information you can. TYhen Fly back to the KSC.  
	notes = This mission can be completed using EVA Construction or a mod that allows you to manipulate parts during EVA such as KIS.  
	completedMessage = The United Knations is greatful and thanks you for your assistance in @/crashBiome.FullName()

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 5

//Contract Reward Modifiers
	prestige = Exceptional
	targetBody = Kerbin
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * 2 * Random(1.0,1.15)
	rewardReputation = 10.0
	rewardScience = 0.0

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 5.0
	

// REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		minCount = 1
		contractType = GAPFASR02-Rescue-Splashed
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		minCount = 1
		contractType = GAPFASR03-Rescue-Landed
	}
	
	
// Verify that all parts for the crashed plane are available
	REQUIREMENT
	{
		name = Any
		type = Any

		REQUIREMENT
		{
			name = PartUnlocked
			type = PartUnlocked
			part = ServiceBay_125
		}
		REQUIREMENT
		{
			name = PartUnlocked
			type = PartUnlocked
			part = ServiceBay_125_v2
		}
	}

	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		part = CircularIntake
    }
	
	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		part = Mark2Cockpit
	}
	
	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		part = SmallGearBay
	}
	
	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		part = wingConnector3
	}

// wait 15 days before offering another	
	REQUIREMENT
	{
		title = Cool down timer 15 days
		name = CompleteContract
		type = CompleteContract
		minCount = 0
		contractType = GAPFASR04-MissingAircraft
		cooldownDuration = 15d
	}

//------------------------------------------------------------------------	
//DATA NODES TO PROCESS FOR CONTRACT USE
//------------------------------------------------------------------------	

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA		
	{
		type = string
		craft = GAPFASR-Rescue-MissingAircraft + @/flightNumber 
		uniquenessCheck = GROUP_ACTIVE
		hidden = true
	}
// Flight Destination 
	DATA
	{
		type = int
		fltLocationSelection = Random(@GFAS:siteComm2Start, @GFAS:siteComm2Stop)
	}
// Base name 
	DATA
	{
		type = string
		baseFullName = @GFAS:siteFullName.ElementAt(@/fltLocationSelection)
		hidden = true
	}

// Base name 
	DATA
	{
		type = string
		baseIATAcode = @GFAS:siteName.ElementAt(@/fltLocationSelection)
		hidden = true
	}
// flightNumber
	DATA
	{
		type = string
		flightNumber = "KA" + @/fltLocationSelection +"RM"
		hidden = true
	}
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
//Create Boffin-------------
	// Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	// Traits for Boffin - More Pilots
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Pilot","Engineer","Scientist"]
		hidden = true
	}
	
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true	
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}
// The pilot
// Randomly select 0 (male) or 1 (female)
	DATA
	{
		type = int
		genderType = Random(0,1)
	}

//create a bool for gender	
	DATA
    {
        type = bool
		isFemale = @/genderType == 1
    }
	DATA
	{
		type = string
		rescueKerbalName = RandomKerbalName(@/isFemale ? Female : Male)
		rescuePronoun = @/isFemale ? "her" : "him"
		hidden = true
		
	}
	DATA
	{
		type = List<Kerbal>
		rescueKerbal = [ NewKerbal( @/isFemale ? Female : Male, @/rescueKerbalName, "Pilot"  ) ]
		hidden = true
		
	}
 // Where the downed Kerbals are 
	DATA
	{
		type = Waypoint
		hidden = true
		crashWaypoint = @/CrashWaypointGenerator.Waypoints().ElementAt(3)
	}
	DATA
	{
		type = Location
		hidden = true
		crashLocation = @/crashWaypoint.Location()
	}
//------------------------------------------------------------------------	
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
//------------------------------------------------------------------------
//Set the missing plane at the Waypoint
	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel

		VESSEL
		{
			name = Missing Aircraft
			craftURL = GAPFAS/Assets/Ships/MissingAircraft.craft
			flagURL = GAPFAS/Assets/Flags/KSPAS
			vesselType = Unknown
			owned = false
			lat = @/crashLocation.Latitude()
			lon = @/crashLocation.Longitude()
			// spawn above the terrain and settle. Stops spawning below and being destroyed. 
			height = 10.0
			
		}
	}

//Remove the missing plane when the contract completes
	BEHAVIOUR
	{
		name = DestroyVessel
		type = DestroyVessel
		onState = CONTRACT_COMPLETED
		vessel = Missing Aircraft
	}
	
	//Kerbals to remove 
	BEHAVIOUR
	{
		name = RemoveKerbal
		type = RemoveKerbal
		kerbal = @/rescueKerbal.ElementAt(0)
	}

    //Spawn Kerbal to be rescued 
	BEHAVIOUR
	{
		name = SpawnKerbal
		type = SpawnKerbal

		KERBAL
		{
			kerbal = @/rescueKerbal.ElementAt(0)
			kerbalType = Unowned
			owned = false
			addToRoster = false
			lat = @/crashLocation.Latitude() + (Random(-99,99) / 100000)
			lon = @/crashLocation.Longitude() + (Random(-99,99) / 100000)
			heading = Random(0,359)

		}
	}
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Unowned
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
    }
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
// Waypoint to determine Crash zone
	BEHAVIOUR
	{
        name = CrashWaypointGenerator
        type = WaypointGenerator
		
		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @/targetBody
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
			parameter = MissionGoalLanding
		}
		
		WAYPOINT
		{
			name = KSC Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			targetBody =  @/targetBody
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLandingKSC
		}
		
		//The anchor base for the rescue
		WAYPOINT
		{
			name = @GFAS:siteName.ElementAt(@/fltLocationSelection) + " Runway"
			targetBody =  @/targetBody
			altitude = 0
			latitude = @GFAS:siteLAT.ElementAt(@/fltLocationSelection)
			longitude = @GFAS:siteLON.ElementAt(@/fltLocationSelection)
			hidden = true					   
		}
		
		//Random Waypoint near the Anchor Base
	    RANDOM_WAYPOINT_NEAR
		{
		
			name = Rescue Location
			icon = GAPFAS/Assets/Icons/Missingaircraft
			targetBody =  @/targetBody
			nearIndex = 2
			maxDistance = 150000.0
			minDistance = 900000.0
			waterAllowed = true
			altitude = 0.0
		}	
	}
//Contract Dialogs	
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffLaunch
			
			position = CENTER
			title = <b>Take Off</b>
			titleColor = #BADA55
			TEXT
			{
				text = <color=#BADA55>Flight, you are cleared for take off. Proceed to the pilot's rescue location. Good hunting.</color> 
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}		
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingRescue
			
			position = CENTER
			
			TEXT
			{
				text = Flight, you are approaching the target area. Keep your eyes peeled. set down and get the pilot on board quickly. 
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoalLanding
			
			position = CENTER
			textColor = #BADA55
			
			TEXT
			{
				text = <color=#BADA55>Flight, copy that. You have the package on board. Proceed immediately back to the KSC Directions have been transmited to you.</color>
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}		

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingKSC
			
			position = CENTER
			textColor = #BADA55
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal. Directions have been transmited to you.
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}	
//------------------------------------------------------------------------
// Mission completed dialog	
//------------------------------------------------------------------------		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionEnding

			position = CENTER
			
			TEXT
			{
				text = Welcome home. Excellent job. When you've recovered your aircraft report to Operations for debriefing.  
				textColor = #BADA55
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
// failed misssion dialog		
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = Oh No! Are you there? Please respond. We've lost sight of you, do you copy? Are you declaring an emergency?.... and you were doing so well.
				fontSize = 20
				textColor = #B00B1E
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
	}

// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		define = @/craft
		dissassociateVesselsOnContractCompletion = true
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			title = have the boffin on board
			kerbal = @/kerbalsBoffins.ElementAt(0) 
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCrewCapacity
			type = HasCrewCapacity
			title = have seating for your crew and @/rescueKerbalName
			minCapacity = 3
			disableOnStateChange = false
			
		}
	}
//Launch Site
	PARAMETER
	{
		name = MissionStart
		type = VesselParameterGroup
		title = begin at the KSC Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = RequestTakeoffLaunch
			type = Duration
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
	}

// -----------------------------------------------------------------
// Flight to rescue
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingRescue
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Contract Goals
// -----------------------------------------------------------------

// -----------------------------------------------------------------
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingKSC
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------


	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		title = complete flight to the KSC runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			hideOnCompletion = true
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody =  @/targetBody
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
	}
//Recovery Parameter - Does the Boffin Join the program?
	PARAMETER
	{
		name = BoffinCheckYes
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I'm In! 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin signs up
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
	
	PARAMETER
	{
		name = BoffinCheckNegative
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I prefer the Lab 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin reassigned to lab
			expression = @/boffinHireChance > @GFAS:boffinChoiceChance
		}
	}
	PARAMETER
	{
		name = MissionEnding
		type = VesselParameterGroup
		vessel = @/craft
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}

//Recovery Parameter
	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft
		completeInSequence = true
		hideChildren = true
	}
// -----------------------------------------------------------------
// END OF CONTRACT
// -----------------------------------------------------------------
}