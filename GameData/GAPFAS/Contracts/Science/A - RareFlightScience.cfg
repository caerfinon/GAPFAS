// -----------------------------------------------------------------
//	CONTRACT:  Fly an airplane higher above the Atmospheric Threshhold - KSP Air Service - KSP Air Service Science
//	Author: Caerfinon 
//	Credits:
//	{
//		Original GAP: Author - inigma
//		Original Kerbin side GAP: Author - Keniamin 
//	}
// -----------------------------------------------------------------
CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFASA
	name = GAPFASA-RareFlightScience
	title = Collect Science from rare locations with an airplane
	group = KSP Air Service Science
	agent = KSP Air Service

	description = Fly an aircraft to the science location waypoint and collect science, and then land back at KSC safely. @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.
	genericDescription = Take an air-breathing airplane and collect science from a rare location
	synopsis = Fly an aircraft to collect rare science.
	notes = @isLanded ? @landStr : @waterStr
	completedMessage = You have successfuly completed the mission for the KSP Air Service! 

//Contract Limits
	maxCompletions = 1
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * Random(1.0,1.15)
	rewardReputation = 1
	rewardScience = 5

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 10
	
// -----------------------------------------------------------------	
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAS2-Speed220
		minCount = 1
		
	}
	//After mission is complete wait 7 day before offering it again	
	REQUIREMENT
	{
		title = Cool down timer 7 day
		name = CompleteContract
		type = CompleteContract
		minCount = 0
		contractType = GAPFASA-RareFlightScience
		cooldownDuration = 7d
	}
    REQUIREMENT
    {
        name = Science
        type = Science

        // Maximum amount of science the player can have before this contract
        // no longer shows up.
        maxScience = 1000
    }

// -----------------------------------------------------------------	
//DATA NODES TO PROCESS FOR CONTRACT USE
// -----------------------------------------------------------------

// Craft unique name
	DATA
	{
		type = string
		craft = GAPFAScraftRareFlightScience
		
	}
	
//Create Air Trafic Control Character
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
// Science related information 
	DATA
    {
		type = bool
        isLanded = @situation == SrfLanded
    }
	
    DATA
	{
        type = string
										 
        hidden = true

        waterStr = Strange as it sounds, your aircraft should be prepared for a water landing at @biome.FullName().
		waterLnfg = SPLASHED
		landLndg = LANDED
        landStr = Strange as it sounds, your aircraft should be prepared for a ground landing at @biome.FullName().
    }

    DATA
    {
        type = List<CelestialBody>
        hidden = true
        validBodies = [ HomeWorld()]
    }		

    DATA
    {
        type = List<ScienceSubject>
        hidden = true

        ssTemp1 = DifficultScienceSubjectsByBody(@validBodies)
 		ssTemp2 = @ssTemp1.Where(s => s.RemainingScience() >= 0.0 && s.Experiment() != asteroidSample)
    }

    DATA
    {
        type = ScienceSubject
        hidden = true
        ss0 = @ssTemp2.Random()
    }

    DATA
    {
        type = Biome
        hidden = true
        biome = @ss0.Biome()
    }

    DATA
    {
        type = ExperimentSituations
        hidden = true
        situation = @ss0.Situation()
    }

    DATA
    {
        type = List<ScienceSubject>
        title = Must have a valid experiment to run in a rare situation

        scienceSubjectsTemp1 = DifficultScienceSubjects().Where(s => s.Biome() == @biome)
        scienceSubjectsTemp2 = @scienceSubjectsTemp1.Where(s => s.Situation() == @situation)
        scienceSubjects = @scienceSubjectsTemp2.Where(s => s.CollectedScience() == 0.0 && s.Experiment() != asteroidSample).Random(3)
    }

    DATA
    {
        type = List<Location>
        hidden = true
        locations = @biome.DifficultLocations()
    }

    DATA
	 
    {
        type = Location
        requiredValue = false
        loc0 = @locations.Random()

    }

    DATA
    {
        type = ScienceRecoveryMethod
        recoveryMethod = RecoverOrTransmit
    }

//Create Boffin-------------
	// Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	// Traits for Boffin - More Scientists
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Engineer","Scientist","Scientist"]
		hidden = true
	}
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
		
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}
// -----------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// -----------------------------------------------------------------
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Unowned
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
    }
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		
		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @GFAS:whereAreWe
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
		}
		
		WAYPOINT
		{
			name = KSC Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			targetBody = @GFAS:whereAreWe
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLanding
			
		}
        WAYPOINT
        {
            name = "Science Location @/biome.Name()"
            icon = GAPFAS/Assets/Icons/research
            latitude = @/loc0.Latitude()
            longitude = @/loc0.Longitude()
			altitude = 0.0
        }
	}

// Mission Dialog boxes
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffLaunch
			
			position = CENTER
			
			TEXT
			{
				text = Flight, you are cleared for depature and immediate take off. Fly safe.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingSite2
			
			position = CENTER
			
			TEXT
			{
				text = Flight, You are aproaching the target location. Have a safe landing 
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoal
			
			position = CENTER
			
			TEXT
			{
				text = Fight, you have achieved the paramters of the mission goal. Return to the KSC to for mission debriefing. Well Done. Fly safe.   
				fontSize = 20
				textColor = #BADA55
			}

			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingKSC
			
			position = CENTER
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal. Directions have been transmited to you.
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}

//------------------------------------------------------------------------
// Mission completed dialog	
//------------------------------------------------------------------------		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionEnding
			position = CENTER
			
			TEXT
			{
				text = Welcome home. Excellent job. When you've recovered your aircraft report to the R&D Lab to review your findings.  
				textColor = #BADA55
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
// failed misssion dialog
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = Oh No! Are you there? Please respond. We've lost sight of you, do you copy? Are you declaring an emergency?.... and you were doing so well.
				fontSize = 20
				textColor = #B00B1E
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
			
		}
	}

// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		define = @/craft
		dissassociateVesselsOnContractCompletion = true
		completeInSequence = true
		disableOnStateChange = true
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			title = have the boffin on board
			kerbal = @/kerbalsBoffins.ElementAt(0) 
			disableOnStateChange = false
			hideChildren = true
		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			category = Aero
			disableOnStateChange = false
			hideChildren = true
		}
		
        PARAMETER
        {
            name = PartValidation
            type = PartValidation
            title = not have any solid rocket motors
			disableOnStateChange = false
			hideChildren = true
            NONE
            {
                MODULE
                {
                    name = ModuleEngines
					allowShutdown = False
					
                }
				
            }
        }
	}
	
//Launch Site
	PARAMETER
	{
		name = MissionStart
		type = VesselParameterGroup
		title = begin at the KSC Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
		PARAMETER
		{
			name = RequestTakeoffLaunch
			type = Duration
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
	}
// -----------------------------------------------------------------	
// Trip to Site2
// -----------------------------------------------------------------
	PARAMETER
	{
		name = RequestLandingSite2
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 2
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}	
	
// -----------------------------------------------------------------	
// Contract Goals
// -----------------------------------------------------------------
	
	PARAMETER
	{
		name = MissionGoal
		type = VesselParameterGroup
		vessel = @/craft
		title = Travel to the research location
		disableOnStateChange = true
		completeInSequence = true
		targetBody = @GFAS:whereAreWe

		
		PARAMETER
		{
			title = be flying
			name = ReachState
			type = ReachState
			situation = Flying
			disableOnStateChange = true
			targetBody = @GFAS:whereAreWe
		}
		PARAMETER
		{
			name = Landing
			type = All
			title = Land your aircraft
			notes = be within 500 meters of the marker
			completeInSequence = true
			disableOnStateChange = true
			targetBody = @GFAS:whereAreWe
			PARAMETER
			{
				title = and come to a stop
				name = ReachState
				type = ReachState
				hideChildren = true
				maxSpeed = 0.0
				situation = @/isLanded ? LANDED : SPLASHED
				disableOnStateChange = false
				targetBody = @GFAS:whereAreWe

			}
			PARAMETER
			{
				title = near the research location
				name = VisitWaypoint
				type = VisitWaypoint
				index = 2
				distance = 50
				horizontalDistance = 50
				showMessages = true
				disableOnStateChange = false
				targetBody = @GFAS:whereAreWe
 
	
			}
		}
		PARAMETER
		{
			name = CollectScience
			type = CollectScience
			subject = @/scienceSubjects
			recoveryMethod = @/recoveryMethod
			disableOnStateChange = true
		}
	}
// -----------------------------------------------------------------
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingKSC
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------


	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		title = complete flight to the KSC runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = @GFAS:whereAreWe
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
	}
//Recovery Parameter - Does the Boffin Join the program?
	PARAMETER
	{
		name = BoffinCheckYes
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = The Boffin decides: I'm In! 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin signs up
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
	
	PARAMETER
	{
		name = BoffinCheckNegative
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = completionText = The Boffin decides: I prefer the Lab 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin reassigned to lab
			expression = @/boffinHireChance > @GFAS:boffinChoiceChance
		}
	}
	PARAMETER
	{
		name = MissionEnding
		type = VesselParameterGroup
		vessel = @/craft
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}
//Recovery Parameter
	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft
		completeInSequence = true
		hideChildren = true

	}
// -----------------------------------------------------------------
// END OF CONTRACT
// -----------------------------------------------------------------
}



	



	
