// -----------------------------------------------------------------
//	CONTRACT:  First in Flight - KSP Air Service - KSP Air Service Science - Build and fly you first aircraft
//	Author: Caerfinon 
//	Credits: 
// -----------------------------------------------------------------
CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFAS0
	name = GAPFAS0-FirstInFlight 
	title = First in Flight 
	group = KSP Air Service Science
	agent = KSP Air Service

	description =  Linus Kerman wants to create an Air Service for the Kerbal Space Center. There's a lot of science to be learned from mastering atmospheric flight. @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.    
	genericDescription = Linus Kerman wants to create an Air Service for the Kerbal Space Center
	synopsis = Build an airplane in the SPH and take to the skies  
	// notes = 
	completedMessage = You have successfuly completed the first flight of the KSP Air Service! 

//Contract Limits
	maxCompletions = 1
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * Random(1.0,1.15)
	rewardReputation = 1
	rewardScience = 5

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 10
	
// -----------------------------------------------------------------	
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------	

	
// -----------------------------------------------------------------	
//DATA NODES TO PROCESS FOR CONTRACT USE
// -----------------------------------------------------------------

	DATA
	{
		type = string
		craft = GAPFAScraftFirstInFlight
		
	}
// minAltitude and MaxAltitude values
	DATA
	{
		type = float
		maxTargetAltitude = @GFAS:flyHiLo / 4 
		minTargetAltitude = @GFAS:flyHiLo / 8  
	}
//Create Boffin-------------
    // Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	
	// Traits for Boffin
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Engineer","Scientist"]
		hidden = true
	}
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
		
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}
// -----------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// -----------------------------------------------------------------
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Applicant
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
    }
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
	// If Boffin does not join. Applicant Kerbal should be removed from roster on contract end
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = Boffin reassigned 
		message = This is inform you that @/boffinKerbal has decided to returned to the Lab 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckNo
		}
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		
		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @GFAS:whereAreWe
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
		}
		
		WAYPOINT
		{
			name = KSC Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			targetBody = @GFAS:whereAreWe
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLanding
			
		}
		
	    RANDOM_WAYPOINT_NEAR
		{
			name = the Test Area
			icon =  GAPFAS/Assets/Icons/Patrol
			targetBody = @GFAS:whereAreWe
			nearIndex = 1
			minDistance = 20000.0
			maxDistance = 30000.0
			underwater = true
			altitude = -0.1
		}
	}

// Mission Dialog boxes
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = LaunchSite
			
			position = CENTER
			
			TEXT
			{
				text = Best of luck with this groundbreaking first flight. You have the future of the space program in your hands, so fly straight and bring it home. Fly safe.
				fontSize = 20
				textColor = #BADA55
			}
			
			INSTRUCTOR
			{
				name = Strategy_ScienceGuy
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoal
			
			position = CENTER
			
			TEXT
			{
				text = Well done You! Huzzah! You have achieved the mission goal. Return to the KSC to review your findings. Fly safe.   
				fontSize = 20
				textColor = #BADA55
			}
			
			INSTRUCTOR
			{
				name = Strategy_ScienceGuy
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLanding
			
			position = CENTER
			
			TEXT
			{
				text = You are cleared for landing. We'll meet you at the terminal. Welcome back.
				textColor = #BADA55
			}
			
			INSTRUCTOR
			{
				name = Strategy_ScienceGuy
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}
		}

//------------------------------------------------------------------------
// Mission completed dialog	
//------------------------------------------------------------------------		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionAccomplished

			position = CENTER
			
			TEXT
			{
				text = Absolutely outstanding work! You have secured the future of the program. Get your aircraft to the hanger then come to my office to discuss the future of the KSP Air Service!  
				textColor = #BADA55
			}
			
			INSTRUCTOR
			{
				name = Strategy_ScienceGuy
				showName = true
				textColor = #BADA55
				animation = true_thumbsUp
			}
			
		}
		
// failed misssion dialog
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = Oh No! Are you there? Please respond. We've lost sight of you, do you copy? Are you declaring an emergency?.... and you were doing so well.
				fontSize = 20
				textColor = #B00B1E
			}
			
			INSTRUCTOR
			{
				name = Strategy_ScienceGuy
				showName = true
				textColor = #BADA55
				animation = idle_sigh
			}
			
			
		}
	}

// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have the boffin on board
			kerbal = @/kerbalsBoffins.ElementAt(0) 
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			category = Aero
			disableOnStateChange = false
			hideChildren = true
		}
		
		PARAMETER
		{
			name = All
			type = All
			title = have an air breathing engine only
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket engines

				NONE
				{
					MODULE
					{
						EngineType = SolidBooster	
					}	
				}
				disableOnStateChange = false
				hideChildren = true
			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any liquid rocket engines
				NONE
				{
					MODULE
					{
						EngineType = LiquidFuel
					}	
				}	
				disableOnStateChange = false
				hideChildren = true
			}
			
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any solid rocket fuel
				resource = SolidFuel				
				minQuantity = 0.0
				maxQuantity = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any oxidizer
				resource = Oxidizer				
				minQuantity = 0.0
				maxQuantity = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			disableOnStateChange = false
		}

	}
	
	//Launch Site
	PARAMETER
	{
		name = LaunchSite
		type = VesselParameterGroup
		title = begin at the KSC Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = false
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = RequestTakeoffLaunch
			type = Duration
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
	}
	
// -----------------------------------------------------------------	
// Contract Goals
// -----------------------------------------------------------------
	
	PARAMETER
	{
		name = MissionGoal
		type = VesselParameterGroup
		title = complete the first flight mission
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true

		PARAMETER
		{
			name = the Test Area
			type = VisitWaypoint
			title = approach the destination waypoint (500 meters)
			index = 2
			distance = 500
			showMessages =  true
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = true
			hideChildren = true
		}

		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = while flying  			
			targetBody = @GFAS:whereAreWe
			situation = FLYING
			disableOnStateChange = true
			completeInSequence = true
			hideChildren = true
		}
	
	}
	
// -----------------------------------------------------------------
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLanding
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------


	PARAMETER
	{
		name = LandingSite
		type = VesselParameterGroup
		title = complete flight to the KSC runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = @GFAS:whereAreWe
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}

		PARAMETER
		{
			name = TerminalrampKSC
			type = Duration
			duration = 10s
			preWaitText = reflect on what you have accomplished:
			waitingText = reflecting: 
			completionText = well done you 
			completeInSequence = true
			disableOnStateChange = false
		}
	}

	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		vessel = @/craft
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}
	
//Recovery Parameter - Does the Boffin Join the program?
	PARAMETER
	{
		name = BoffinCheckYes
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I'm In! 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin signs up
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
	
	PARAMETER
	{
		name = BoffinCheckNegative
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = Not for me 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin reassigned to lab
			expression = @/boffinHireChance > @GFAS:boffinChoiceChance
		}
	}
//Recovery Parameter
	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft
		completeInSequence = true
		hideChildren = true

	}
// -----------------------------------------------------------------
// END OF CONTRACT
// -----------------------------------------------------------------
}



	



	
