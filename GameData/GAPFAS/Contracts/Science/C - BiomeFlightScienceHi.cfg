// -----------------------------------------------------------------
//	CONTRACT:  Research science in the upper atmosphere - KSP Air Service - KSP Air Service Science
//	Author: Caerfinon 
// Credits: Adapted from Inigma's - Contract Pack: Giving Aircraft a Purpose (GAP) - The MIT License (MIT) Copyright (c) 2015-2018 inigmatus
// -----------------------------------------------------------------
CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFASB
	name = GAPFASB-BiomeFlightScienceLow
	title = Research science in the upper atmosphere
	group = KSP Air Service Science
	agent = KSP Air Service

	description = Collect science from the upper atmosphere in the @/biome biome, and then land back at KSC safely.
	genericDescription = Take an aircraft and Collect science from the upper atmosphere in the target biome
	synopsis = Collect science from the upper atmosphere.
	// notes = 
	completedMessage = You have successfuly completed the mission for the KSP Air Service! 

//Contract Limits
	maxCompletions = 1
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * Random(1.0,1.15)
	rewardReputation = 1
	rewardScience = 5

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 10
	
// -----------------------------------------------------------------	
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------	

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAS7-FlyHigh1
		minCount = 1
		
	}

//After mission is complete wait 7 day before offering it again	
	REQUIREMENT
	{
		title = Cool down timer 7 day
		name = CompleteContract
		type = CompleteContract
		minCount = 0
		contractType = GAPFASA-RareFlightScience
		cooldownDuration = 7d
	}
	
    REQUIREMENT
    {
        type = Expression
        expression = @/scienceSubjects.Count() >= 5
        title = Must have a valid biome to study
    }

// -----------------------------------------------------------------	
//DATA NODES TO PROCESS FOR CONTRACT USE
// -----------------------------------------------------------------

// Craft unique name
	DATA
	{
		type = string
		craft = GAPFAScraftBiomeFlightScience
		
	}
	
//Create Air Trafic Control Character

	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
	
    DATA
    {
        type = Biome
        uniquenessCheck = CONTRACT_ACTIVE
        hidden = true
        biome = @targetBody.Biomes().Where(b => b.RemainingScience() > 50.0).SelectUnique()
    }

    DATA
    {
        type = List<ScienceSubject>
        hidden = true
        scienceSubjects = AllScienceSubjectsByBiome([@biome]).Where(s => s.CollectedScience() == 0.0).Random(8)
    }

    DATA
    {
        type = ScienceRecoveryMethod
        hidden = true
        recoveryMethod = RecoverOrTransmit
    }


	

// -----------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// -----------------------------------------------------------------
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		
		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @GFAS:whereAreWe
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
		}
		
		WAYPOINT
		{
			name = KSC Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			targetBody = @GFAS:whereAreWe
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLandingLaunch
			
		}
	}

// Mission Dialog boxes
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = LaunchSite
			
			position = CENTER
			
			TEXT
			{
				text = Flight, you are cleared for depature and immediate take off. Fly safe.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingSite2
			
			position = CENTER
			
			TEXT
			{
				text = Flight, You are aproaching the target location. Good hunting on your research mission 
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}		
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLanding
			
			position = CENTER
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal. Directions have been transmited to you.
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}

//------------------------------------------------------------------------
// Mission completed dialog	
//------------------------------------------------------------------------		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionAccomplished

			position = CENTER
			
			TEXT
			{
				text = Welcome home. Excellent job. When you've recovered your aircraft report to the R&D Lab to review your findings.  
				textColor = #BADA55
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
// failed misssion dialog
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = Oh No! Are you there? Please respond. We've lost sight of you, do you copy? Are you declaring an emergency?.... and you were doing so well.
				fontSize = 20
				textColor = #B00B1E
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
			
		}
	}

// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			
			category = Aero
			
			disableOnStateChange = false
			hideChildren = true

		}
		
        PARAMETER
        {
            name = PartValidation
            type = PartValidation
            title = not have any solid rocket motors

            NONE
            {
                MODULE
                {
                    name = ModuleEngines
					allowShutdown = False
					
                }
				
            }
			
			disableOnStateChange = false
			hideChildren = true
			
        }
		
		disableOnStateChange = false

	}
	
	//Launch Site
	PARAMETER
	{
		name = LaunchSite
		type = VesselParameterGroup
		title = begin at the KSC Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = false
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = RequestTakeoffLaunch
			type = Duration
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
	}
		
// -----------------------------------------------------------------	
// Contract Goals
// -----------------------------------------------------------------

	PARAMETER
	{
		name = All
		type = All
		title = Fly to the research site in the @/biome biome
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = fly in the upper atmosphere
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = @GFAS:whereAreWe
				situation = FLYING
				minAltitude = @GFAS:flyHiLo + 500
				maxAltitude = @GFAS:flySpace - 1000

				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		}
		PARAMETER
		{
			name = Research Site
			type = CollectScience
			biome = @/biome
			subject = @/scienceSubjects.Where(s => s.Situation() == @experimentSituation)
			recoveryMethod = @/recoveryMethod
			rewardFunds = 10000.0 * Random(1.0, 1.15) * @subject.Count()

			ITERATOR
			{
				type = ExperimentSituations

				experimentSituation = [FlyingHigh]
			}

			REQUIREMENT
			{
				type = Expression
				expression = @../subject.Count() > 0
			}
		}		
		completeInSequence = true
		disableOnStateChange = true
	}



	
// -----------------------------------------------------------------	
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLanding
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------


	PARAMETER
	{
		name = LandingSite
		type = VesselParameterGroup
		title = complete flight to the KSC runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = @GFAS:whereAreWe
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}

		PARAMETER
		{
			name = TerminalrampKSC
			type = Duration
			duration = 10s
			preWaitText = reflect on what you have accomplished:
			waitingText = reflecting: 
			completionText = well done you 
			completeInSequence = true
			disableOnStateChange = false
		}
	}

	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		vessel = @/craft
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}
	
//Recovery Parameter - Recover Kerbals
	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft
		hideChildren = true
	}

// -----------------------------------------------------------------
// END OF CONTRACT
// -----------------------------------------------------------------
}



	



	
