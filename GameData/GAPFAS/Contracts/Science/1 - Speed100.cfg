// -----------------------------------------------------------------
//	CONTRACT:  Fly an airplane 100 m/s - KSP Air Service - KSP Air Service Science
//	Author: Caerfinon 
// Credits: Adapted from Inigma's - Contract Pack: Giving Aircraft a Purpose (GAP) - The MIT License (MIT) Copyright (c) 2015-2018 inigmatus
// -----------------------------------------------------------------
CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFAS1
	name = GAPFAS1-Speed100 
	title = Fly an airplane 100 m/s
	group = KSP Air Service Science
	agent = KSP Air Service

	description = Take an air-breathing airplane above @/minTargetAltitude m but below @/maxTargetAltitude m and see if you can exceed 100 m/s safely in level controlled flight, and then land back at KSC safely. @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.
	genericDescription = Take an air-breathing airplane and see if you can exceed 100 m/s safely in level controlled flight
	synopsis = Fly an aircraft at 100 m/s   
	// notes = 
	completedMessage = You have successfuly completed the mission for the KSP Air Service! 

//Contract Limits
	maxCompletions = 1
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * Random(1.0,1.15)
	rewardReputation = 1
	rewardScience = 5

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 10
	
// -----------------------------------------------------------------	
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------	
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAS0-FirstInFlight
		minCount = 1
		
	}

// -----------------------------------------------------------------	
//DATA NODES TO PROCESS FOR CONTRACT USE
// -----------------------------------------------------------------

// Craft unique name
	DATA
	{
		type = string
		craft = GAPFAScraftSpeed100
		
	}
	
//Create Air Trafic Control Character

	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
// minAltitude and MaxAltitude values
	DATA
	{
		type = float
		maxTargetAltitude = @GFAS:flyHiLo / 4 
		minTargetAltitude = @GFAS:flyHiLo / 8  
	}
//Create Boffin-------------
    // Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	
	// Traits for Boffin
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Engineer","Scientist"]
		hidden = true
	}
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
		
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}
// -----------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// -----------------------------------------------------------------
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Applicant
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
    }
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		
		WAYPOINT
		{
			name = KSC Runway
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @GFAS:whereAreWe
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
		}
		
		WAYPOINT
		{
			name = KSC Air Terminal
			icon = GAPFAS/Assets/Icons/terminal
			targetBody = @GFAS:whereAreWe
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLanding
			
		}
	}

// Mission Dialog boxes
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = LaunchSite
			
			position = CENTER
			
			TEXT
			{
				text = Flight, you are cleared for depature and immediate take off. Fly safe.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoal
			
			position = CENTER
			
			TEXT
			{
				text = Fight, you have achieved the paramters of the mission goal. Return to the KSC to for mission debriefing. Well Done. Fly safe.   
				fontSize = 20
				textColor = #BADA55
			}

			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLanding
			
			position = CENTER
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal. Directions have been transmited to you.
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}

//------------------------------------------------------------------------
// Mission completed dialog	
//------------------------------------------------------------------------		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionAccomplished

			position = CENTER
			
			TEXT
			{
				text = Welcome home. Excellent job. When you've recovered your aircraft report to the R&D Lab to review your findings.  
				textColor = #BADA55
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
// failed misssion dialog
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = Oh No! Are you there? Please respond. We've lost sight of you, do you copy? Are you declaring an emergency?.... and you were doing so well.
				fontSize = 20
				textColor = #B00B1E
			}
			
			IMAGE
			{
				url =  GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
			
		}
	}

// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true
		completeInSequence = true
		disableOnStateChange = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true

		}
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have the boffin on board
			kerbal = @/kerbalsBoffins.ElementAt(0) 
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
			category = Aero
			disableOnStateChange = false
			hideChildren = true
		}
		
		PARAMETER
		{
			name = All
			type = All
			title = have an air breathing engine only
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any solid rocket engines

				NONE
				{
					MODULE
					{
						EngineType = SolidBooster	
					}	
				}
				disableOnStateChange = false
				hideChildren = true
			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				title = not have any liquid rocket engines
				NONE
				{
					MODULE
					{
						EngineType = LiquidFuel
					}	
				}	
				disableOnStateChange = false
				hideChildren = true
			}
			
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any solid rocket fuel
				resource = SolidFuel				
				minQuantity = 0.0
				maxQuantity = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			PARAMETER
			{
				name = HasResource
				type = HasResource
				title = not have any oxidizer
				resource = Oxidizer				
				minQuantity = 0.0
				maxQuantity = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			disableOnStateChange = false
		}
	}
	
	//Launch Site
	PARAMETER
	{
		name = LaunchSite
		type = VesselParameterGroup
		title = begin at the KSC Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = false
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = RequestTakeoffLaunch
			type = Duration
			duration = 5s
			preWaitText = request clearance for takeoff:
			waitingText = requesting clearance for takeoff: 
			completionText = be cleared for takeoff
			completeInSequence = true
			disableOnStateChange = true
		}
	}
	
// -----------------------------------------------------------------	
// Contract Goals
// -----------------------------------------------------------------
	
	PARAMETER
	{
		name = MissionGoal
		type = All
		title = achieve a maximum airspeed of 100 m/s
		completeInSequence = true	
		disableOnStateChange = true
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = fly between @/minTargetAltitude m and @/maxTargetAltitude m
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true				
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = @GFAS:whereAreWe
				situation = FLYING
				minAltitude = @/minTargetAltitude
				maxAltitude = @/maxTargetAltitude
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}
		
		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = fly faster than 100 m/s
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = @GFAS:whereAreWe
				situation = FLYING
				minSpeed = 100

				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
		
			completeInSequence = false
			disableOnStateChange = false
			hideChildren = true	

		}

		PARAMETER
		{
			name = VesselParameterGroup
			type = VesselParameterGroup
			title = with less than 10 m/s of vertical speed
			
			vessel = @/craft
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = @GFAS:whereAreWe
				situation = FLYING
				minRateOfClimb = -10
				maxRateOfClimb = 10

				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}

		}

		PARAMETER
		{
			name = Duration
			type = Duration
			
			duration = 5s
			preWaitText = and hold for:
			waitingText = and hold for: 
			completionText = You did it!

			completeInSequence = true
			disableOnStateChange = false			
			
		}
	
	}
	
// -----------------------------------------------------------------
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLanding
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------


	PARAMETER
	{
		name = LandingSite
		type = VesselParameterGroup
		title = complete flight to the KSC runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}

		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = @GFAS:whereAreWe
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = MissionAccomplished
		type = VesselParameterGroup
		vessel = @/craft
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
		}
	}
	
//Recovery Parameter - Does the Boffin Join the program? 
	PARAMETER
	{
		name = BoffinCheckYes
		type = RecoverVessel
		title = and recover your aircraft
		completeInSequence = true
		hideChildren = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
//Recovery Parameter - Does the Boffin Join the program?
	PARAMETER
	{
		name = BoffinCheckYes
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = I'm In! 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin signs up
			expression = @/boffinHireChance <= @GFAS:boffinChoiceChance
		}
	}
	
	PARAMETER
	{
		name = BoffinCheckNegative
		type = Duration
		duration = 10s
		preWaitText = The Boffin is thinking:
		waitingText = Think think think: 
		completionText = Not for me 
		completeInSequence = true
		disableOnStateChange = true
		
		REQUIREMENT
		{
			name = Expression
			type = Expression
			title = Boffin reassigned to lab
			expression = @/boffinHireChance > @GFAS:boffinChoiceChance
		}
	}
//Recovery Parameter
	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft
		completeInSequence = true
		hideChildren = true

	}
// -----------------------------------------------------------------
// END OF CONTRACT
// -----------------------------------------------------------------
}



	



	
