CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFASB1
	name = GAPFASB1-BiomeLoFlightScience
	title = KSPAS Flight @/flightNumber - @/baseIATAcode0 - @/biome.FullName() biome at the @/waypoint.Name() location. Total Distance: @/totalDistance km
	genericTitle = Collect science from a biome with an aircraft flying low
	group = KSP Air Service Science
	agent = KSP Air Service

	description = Fly an aircraft to the @biome.FullName() biome below the Stratosphere Threshhold and collect science at the target location, and then land back at @/baseIATAcode0 safely. @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.
	genericDescription = Take an aircraft and collect science from a biome while flying low.
	synopsis = Fly an aircraft to collect science while flying.
	completedMessage = You have successfuly completed the mission for the KSP Air Service! 

//Contract Limits
	maxCompletions = 1
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * Random(1.0,1.15) * 1.5
	rewardReputation = 1
	rewardScience = 5

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 10
	
// -----------------------------------------------------------------	
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFAS2-Speed220
		minCount = 1
		
	}
	//After mission is complete wait 7 day before offering it again	
	REQUIREMENT
	{
		title = Cool down timer 7 day
		name = CompleteContract
		type = CompleteContract
		minCount = 0
		contractType = GAPFASB1-BiomeLoFlightScience
		cooldownDuration = 7d
	}
    REQUIREMENT
    {
        name = Science
        type = Science

        // Maximum amount of science the player can have before this contract
        // no longer shows up.
        maxScience = 1000
    }

// -----------------------------------------------------------------	
//DATA NODES TO PROCESS FOR CONTRACT USE
// -----------------------------------------------------------------
// flightNumber
	DATA
	{
		type = string
		flightNumber = "KA0LO"
		hidden = true
	}
// Craft unique name
	DATA
	{
		type = string
		craft = GAPFAScraftBiomeLoFlightScience
	}
// Base name 
	DATA
	{
		type = string
		baseIATAcode0 = @GFAS:siteName.ElementAt(0) 
		hidden = true
	}	
//Create Air Trafic Control Character
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}
	// -----------------------------------------------------------------
	// Science related information
	// ----------------------------------------------------------------- 
    DATA
    {
        type = List<CelestialBody>
        hidden = true
        validBodies = [ HomeWorld()]
    }		
    DATA
    {
        type = Waypoint
        hidden = true
        waypoint = @/WaypointGenerator.Waypoints().Last()
    }
	
    DATA
    {
        type = Biome
        hidden = true
        biome = @/waypoint.Location().Biome()
    }
    DATA
    {
        type = List<ScienceSubject>
        hidden = true

        scienceSubjectsTemp1 = AllScienceSubjectsByBiome([@biome])
        scienceSubjectsTemp2 = @scienceSubjectsTemp1.Where(s => s.Situation() == SrfLanded)
        scienceSubjectsTemp3 = @scienceSubjectsTemp2.Where(s => s.NextScienceReportValue() > 1.0)
        scienceSubjectsTemp4 = @scienceSubjectsTemp3.Where(s => s.Experiment() != evaReport && s.Experiment() != surfaceSample && !s.Experiment().ID().StartsWith("ROCScience_"))
		scienceSubjectsTemp5 = @scienceSubjectsTemp4.Where(s => s.Situation() == FlyingLow )
        scienceSubjects = @scienceSubjectsTemp5.Where(s => !s.Biome().IsKSC()).Random(3)
    }

	// -----------------------------------------------------------------
	// Haversine Distance Calculations between waypoints
	// -----------------------------------------------------------------
	  
	DATA
	{
		type = int
		fltLocationSelection0 = 0 // Always refers to KSC
	}
	DATA
	{
		type = double
		hidden = true

        // Inputs from Group Level data
        // Flight locations KSC, to randomly selected airport 
        lat0 = @GFAS:siteLAT.ElementAt(0)
        lon0 = @GFAS:siteLON.ElementAt(0)
		lat1 = @/waypoint.Location().Latitude()
        lon1 = @/waypoint.Location().Longitude()
		radius = @GFAS:whereAreWe.Radius() // in meters

        // Constants
        PI = 3.141592653589793

        // Multi-step haversine calculation  KSC to Site 1
        dLat1 = (@/lat1 - @/lat0) * @/PI / 180.0
        dLon1 = (@/lon1 - @/lon0) * @/PI / 180.0
        lat1r1 = @/lat0 * @/PI / 180.0
        lat2r1 = @/lat1 * @/PI / 180.0
        a1 = Pow(Sin(@/dLat1 / 2.0), 2) + Pow(Sin(@/dLon1 / 2.0), 2) * Cos(@/lat1r1) * Cos(@/lat2r1)
        c1 = 2.0 * Asin(Pow(@/a1, 0.5))
		// final result (meters)
        d1 = @/radius * @/c1

	}
	// Convert to integer and km 
	DATA
	{
		type = int
		hidden = true
		distance1 = int(@/d1) / 1000
		totalDistance = @/distance1 * 2
	}	 


//Create Boffin-------------
	// Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	// Traits for Boffin - More Scientists
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Engineer","Scientist","Scientist"]
		hidden = true
	}
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
		
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
		
	}
// -----------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
// -----------------------------------------------------------------
	// Boffin Behaviours
    // Spawn the Boffin
