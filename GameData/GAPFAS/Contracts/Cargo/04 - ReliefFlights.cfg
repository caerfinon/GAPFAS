// -----------------------------------------------------------------
//	CONTRACT:  GAPFASC04-Relief-Flights - KSP Air Service - KSP Air Service - Relief Supply Drop 
//	Author: Caerfinon 
//	Credits:
//	{
//		Original GAP: Author - inigma
//		Original Kerbin side GAP: Author - Keniamin 
//	}
// -----------------------------------------------------------------

CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFASC04
	name = GAPFASC04-Relief-Flights
	title = KSPAS Relief Flight
	genericTitle = KSPAS Relief Flight
	group = KSP Air Service Cargo
	agent = KSP Air Service

	description = There has been a disaster in @/diasaterBiome.FullName()! The region has suffered @/disasterReason and many kerbals need assistance. The KSPAS has been asked to help by delivering relief supplies to the area.  @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.
	genericDescription = There has been a disaster! The affected region is in trouble and many kerbals need assistance. The KSPAS has been asked to help by delivering relief supplies to the area.
	synopsis = There has been a disaster. Deliver relief supplies to the site
	notes = This mission only requires the relief supplies delivered to the disaster site. You can paradrop a probe on the site. Then retun home to your home base 
	completedMessage = completedMessage = You have successfuly completed the mission for the KSP Air Service!

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 5

//Contract Reward Modifiers
	prestige = Significant
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds =  @GFAS:rewardBaseValue * Random(1.0, 1.15) + @/partsNumber * 1000
	rewardReputation = 10 + @/partsNumber * 5

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 20 + @/partsNumber * 20
	
// -----------------------------------------------------------------
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = GAPFASC01-Cargo-Flights
		minCount = 1
	}

	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		part = ReliefSupplies
	}

//After Disaster Relief mission is complete wait 30 days before offering another	
	REQUIREMENT
	{
		title = Cool down timer 30 days
		name = CompleteContract
		type = CompleteContract
		minCount = 0
		contractType = GAPFASC04-Relief-Flights
		cooldownDuration = 30d
	}
//------------------------------------------------------------------------
//DATA NODES TO PROCESS FOR CONTRACT USE
//------------------------------------------------------------------------
//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		craft = KSRGAPDisasterReliefPlane
		craftPod = KSRGAPDisasterReliefPod
	}
// Base name 
	DATA
	{
		type = string
		baseIATAcode0 = @GFAS:siteName.ElementAt(0)
	}
	DATA
	{
		type = Waypoint
		hidden = true
		disasterWaypoint = @/DisasterWaypointGenerator.Waypoints().ElementAt(0)
	}

	DATA
	{
		type = Location
		hidden = true
		disasterLocation = @/disasterWaypoint.Location()
	}
	
	DATA
	{
		type = Biome
		hidden = true
		diasaterBiome = @/disasterLocation.Biome()
	}
	
	DATA
	{
		type = List<string>
		hidden = true
		disasterReasons = ["a seismic anomaly","violent storms","famine","a virus outbreak","earthquakes","a devasting fire","flooding","crop falure","environmental contamination" ]
	}
	
	DATA
	{
		type = String
		hidden = true
		disasterReason = @/disasterReasons.Random()
	}
		
// Cargo relief supplies			  
	DATA
	{
		type = int
        partsNumber = Random(1, 4)    
    }	
//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}

//Create Boffin-------------
	// Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	// Traits for Boffin - More Engineers
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Engineer","Engineer","Scientist"]
		hidden = true
	}
	
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
	}
//------------------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
//------------------------------------------------------------------------
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Unowned
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
	}
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
// Waypoint to determine disaster zone
	BEHAVIOUR
	{
        name = DisasterWaypointGenerator
		type = WaypointGenerator
		WAYPOINT
		{
			name = @/baseIATAcode0 + "Runway"
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @/targetBody
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
			parameter = MissionGoalComplete
		}
		
		WAYPOINT
		{
			name = @/baseIATAcode0 + "Air Terminal"
			icon = GAPFAS/Assets/Icons/terminal
			targetBody =  @/targetBody
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLandingKSC
		}
		// Relief site
		RANDOM_WAYPOINT
		{
			name = Disaster Site
			targetBody = @/targetBody
			icon = GAPFAS/Assets/Icons/emergency
			altitude = 0.0
			waterAllowed = false
		}
	}
//Contract Dialogs	
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox

		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestTakeoffLaunch
			position = CENTER
			
			TEXT
			{
				text = Flight, you are cleared for depature and immediate take off. Your destination location has been marked for you. Fly safe.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestDropZone
			
			position = CENTER
			
			TEXT
			{
				text = Flight, you are nearing the drop zone. Make ready to drop your cargo near the target zone. Good Hunting!
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionGoalComplete
			
			position = CENTER
			
			TEXT
			{
				text = Flight, cargo drop confirmed on target. Well done you. Return to base. Your destination location has been marked for you. Fly safe.
				fontSize = 20
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingKSC
			
			position = CENTER
			
			TEXT
			{
				text = Flight, we have you on approach. You are cleared for landing. On touchdown proceed to the indicated airport terminal. Directions have been transmited to you. Welcome back.
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = MissionEnding
			
			position = CENTER
			
			TEXT
			{
				text = Flight, your mission is complete. Recover your aircraft to the hanger. Good to have you back.    
				textColor = #BADA55
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
			
		}
// failed misssion dialog
		DIALOG_BOX
		{
			condition = CONTRACT_FAILED
			position = CENTER
			title = <b>Sometimes Things Go Wrong</b>
			titleColor = #B00B1E
			
			TEXT
			{
				text = Flight? Please respond. Do you copy? You're not on the radar..... Come in Flight!  
				fontSize = 20
				textColor = #B00B1E
			}
			
			IMAGE
			{
				url = GAPFAS/Assets/Characters/@/site1ATCImage
				characterName = KSPAS Air Traffic Control
			}
		}
	}
// -----------------------------------------------------------------
//PARAMETERS FOR CONTRACT COMPLETION
// -----------------------------------------------------------------
//
//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Your aircraft must meet all requirements
		define = @/craft
		dissassociateVesselsOnContractFailure = true
		completeInSequence = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified pilot
			trait = Pilot
			minCrew = 1
			disableOnStateChange = false
			hideChildren = true
		}

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = have a certified engineer
			trait = Engineer
			minCrew = 1	
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have wings
							
			category = Aero
			disableOnStateChange = false
			hideChildren = true
		}
		PARAMETER
		{
			name = HasCrewCapacity
			type = HasCrewCapacity
			title = have seating for crew and boffin
			minCapacity = 3
			disableOnStateChange = false
		}
		
		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = have @/partsNumber container(s) of relief supplies
			part = ReliefSupplies
			minCount = @/partsNumber
			maxCount = @/partsNumber
			hideChildren = true
		}
	}
	
//Launch Site
	PARAMETER
	{
		name = LaunchSite
		type = VesselParameterGroup
		title = begin at the @/baseIATAcode0 Runway
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideVesselName = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 1600
			hideOnCompletion = false
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
		}
	}

	PARAMETER
	{
		name = RequestTakeoffLaunch
		type = Duration
		duration = 5s
		preWaitText = request clearance for takeoff:
		waitingText = requesting clearance for takeoff: 
		completionText = be cleared for takeoff
		completeInSequence = true
		disableOnStateChange = true
	}

// -----------------------------------------------------------------	
// Trip to Drop zone
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestDropZone
		type = All
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 2
			distance = 10000
			hideOnCompletion = false
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Contract Goals
// -----------------------------------------------------------------

//Navigate to waypoint
	PARAMETER
	{
		name = MissionGoalComplete
		type = VesselParameterGroup
		disableOnStateChange = true
		title = make a relief supplies air drop 
		define = @/craftPod
		dissassociateVesselsOnContractFailure = true

		PARAMETER
		{
			name = VesselIsType
			type = VesselIsType
			vesselType = Probe
			title = in an aircraft with a probe that can be droppped
			notes = probes can use paradrop or their own power to land
		}
			
			PARAMETER
			{
				title = carrying @/partsNumber container(s) of relief supplies
				name = PartValidation
				type = PartValidation
				part = ReliefSupplies
				minCount = @/partsNumber
				maxCount = @/partsNumber
				hideChildren = true
			}
			PARAMETER
			{
				name = ReachState
				type = ReachState
				title = land the probe
				situation = LANDED
				maxSpeed = 0.0
				disableOnStateChange = false
				hideChildren = true
			}
			PARAMETER
			{
				title = near the site marker
				name = VisitWaypoint
				type = VisitWaypoint
				index = 0
				distance = 500
				horizontalDistance = 500
				showMessages = true
				disableOnStateChange = false
				targetBody = @/targetBody
			}				
		}
	}
// -----------------------------------------------------------------	
// Retun Trip to KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = RequestLandingKSC
		type = VesselParameterGroup
		vessel = @/craft
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true
		hidden = true
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			distance = 19000
			hideOnCompletion = true
			completeInSequence = true
			disableOnStateChange = false
			hideChildren = true
			hidden = true
		}
	}

// -----------------------------------------------------------------	
// Landing at KSC
// -----------------------------------------------------------------

	PARAMETER
	{
		name = LandingSite
		type = VesselParameterGroup
		title = complete flight to the @/baseIATAcode0 runway
		notes = land and move to within 50 meters of the terminal
		vessel = @/craft
		disableOnStateChange = true
		completeInSequence = true
		hideVesselName = true
		
		PARAMETER
		{
			name = KSCTerminal
			type = VisitWaypoint
			title = then taxi to the terminal
			index = 1
			distance = 50
			horizontalDistance = 50
			showMessages =  true
			disableOnStateChange = false
		}
			
		PARAMETER
		{
			name = ReachState
			type = ReachState
			title = and stop your aircraft
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			disableOnStateChange = false
			hideChildren = true
		}
		
		PARAMETER
		{
			name = TerminalrampKSC
			type = Duration
			
			duration = 10s
			preWaitText = wait for terminal ramp:
			waitingText = ramp being positioned: 
			completionText = ramp is in place begin deplaning  

			completeInSequence = true
			disableOnStateChange = false
		}
	}

//Recovery Parameter - Craft & Kerbal Safety Check

	PARAMETER
	{
		name = MissionEnding
		type = All
		title = safely
		completeInSequence = true
		disableOnStateChange = true
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your aircraft
			vessel = @/craft
		}

		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone
			vessel = @/craft
			hideChildren = true
		}
	}

//Recovery Parameter - Recover Kerbals

	PARAMETER
	{
		name = RecoverVessel
		type = RecoverVessel
		title = and recover your aircraft													
		completeInSequence = true
	}

// -----------------------------------------------------------------
// END OF CONTRACT
// -----------------------------------------------------------------
}