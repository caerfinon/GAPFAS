CONTRACT_TYPE
{
//CONTRACT DESCRIPTION
	sortKey = GAPFASC02
	name = GAPFASC02-Cargo-Flights
	title = KSPAS Flight @/flightNumber - @/baseIATAcode0 to @/baseFullName1 continuing to @/baseFullName2 
	genericTitle = Medium Cargo Flight
	group = KSP Air Service Cargo
	agent = KSP Air Service

	description = Gus Kerman, head of Space Program Operaations at @/baseIATAcode0 has asked us to provide a @/fltSize cargo flight from @/baseFullName1 to @/baseFullName2 to transport a surplus load of @/fltReason to the destination base. @/boffinKerbal will be tagging along on your mission, @/boffinPronoun is one of our @/boffinTrait "Boffins" and will join you as a passenger at launch time.
	genericDescription = Gus Kerman has asked us to provide a cargo flight to transport cargo between two locations.
	synopsis = Fly a cargo plane to the pick up airport and then to the destination airport and then return to your home base 
	notes = Aircaft must have 1-4 parts from the Payload category and meet minimum weight restrictions. This can be stock parts or any parts from mods that classify them as Payload   
	completedMessage = Thanks for your assistance in helping move the @/fltReason to @/baseFullName2 safely guys. You're the best. I'm sure we will find a use for them somewhere&br;&br;-Gus Kerman&br;&br;Space Program Operations 

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
	autoAccept = false
	declinable = true
	cancellable = true
	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Significant
	targetBody = @GFAS:whereAreWe
	
//Contract Rewards
	advanceFunds = (@/rewardFunds * 0.25 )
	rewardFunds = @GFAS:rewardBaseValue * @/payloadParts  * Random(1.0, 1.15)
	rewardReputation = 1.0 * @/payloadParts

//Contract Penalties
	failureFunds = (@/rewardFunds * 1.15) * Random(1.0, 1.25)
	failureReputation = 2.0 * @/payloadParts
	
// -----------------------------------------------------------------
// REQUIREMENTS FOR CONTRACT TO APPEAR
// -----------------------------------------------------------------

	REQUIREMENT
	{
		name = TechResearched
		type = TechResearched
		tech = supersonicFlight	  
	}

//After mission is complete wait 7 days before offering it again	
	REQUIREMENT
	{
		title = Cool down timer 7 days
		name = CompleteContract
		type = CompleteContract
		minCount = 0
		contractType = GAPFASC02-Cargo-Flights
		cooldownDuration = 7d
	}
//------------------------------------------------------------------------
//DATA NODES TO PROCESS FOR CONTRACT USE
//------------------------------------------------------------------------
//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		craft = GAPFASCargoFlight + @/flightNumber
		uniquenessCheck = GROUP_ACTIVE
		hidden = true
	}
// Flight Destination 
	DATA
	{
		type = int
		fltLocationSelection = Random(@GFAS:siteComm2Start,@GFAS:siteComm2Stop)
	}
//  Cargo Destination
    // Exclude the Index 1 as a destination	
	DATA
	{
		type = int
		dstSiteTemp = Random(@GFAS:siteComm2Start + 1 ,@GFAS:siteComm2Stop)
		// If the src and dst sites are identical, then make the destination Index 1
		fltLocationSelection2 = @/dstSiteTemp == @/fltLocationSelection ?  1 : @/dstSiteTemp
	}

// Base name
	DATA
	{
		type = string
		baseFullName0 = @GFAS:siteFullName.ElementAt(0)
		baseFullName1 = @GFAS:siteFullName.ElementAt(@/fltLocationSelection)
		baseFullName2 = @GFAS:siteFullName.ElementAt(@/fltLocationSelection2)
		hidden = true
	}

// Base name 
	DATA
	{
		type = string
		baseIATAcode0 = @GFAS:siteName.ElementAt(0) 
		baseIATAcode1 = @GFAS:siteName.ElementAt(@/fltLocationSelection)
		baseIATAcode2 = @GFAS:siteName.ElementAt(@/fltLocationSelection2)
		hidden = true
	}
// flightNumber
	DATA
	{
		type = string
		flightNumber = "KA" + @/fltLocationSelection + "C" + @/fltLocationSelection2 + "F"
		hidden = true
	}
// Payloadparts
	DATA
	{
		type = int
		payloadParts = 3
	}
	
	DATA
	{
		type = List<string>
		hidden = true
		fltReasons = ["Not-Rockomax Micronodes", "Small Nose Cones", "OX-STAT Photovoltaic Panels","Communotron 16s","2HOT Thermometers","Illuminator Mk1s","Pegasus I Mobility Enhancers","SENTINEL Infrared Telescopes", "Surface Scanning Modules", "M4435 Narrow-Band Scanners","Mk2-R Radial-Mount Parachutes","Communotron 88-88s","small Thermal Control Systems","CH-J3 Fly-By-Wire Avionics Hubs"]
	}
	
	DATA
	{
		type = string
		hidden = true
		fltReason = @/fltReasons.Random()
	}

//Cargo Size fltSize

	DATA
	{
		type = string
		fltSize = "medium"
		hidden = true 
	}

//Cargo Weight
	DATA
	{
		type = int
		fltMinWeight = 30000
		hidden = true
	}

//List of Possible ATC genders
	DATA
	{
		type = List<string>
		ATCGender = ["M" ,"F"]
		hidden = true
	}
	
// Merge random gender to Group siteATC type to select dialog image
	DATA
	{
		type = string
		site1ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
		
	}

	DATA
	{
		type = string
		site2ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
	}
	
	DATA
	{
		type = string
		site3ATCImage = "ATC_" + @/ATCGender.Random()
		hidden = true
	}
//Create Boffin-------------
	// Random Boffin value
	DATA
	{
		type = int
		boffinGenderType = Random(0,1)
		boffinHireChance = Random(1,100)
	}
	
	// Gender Test
	DATA
    {
        type = bool
        boffinIsFemale = @/boffinGenderType == 1
    }
	// Traits for Boffin - More Pilots
	DATA
	{
		type = List<string>
		boffinTraitList = ["Pilot","Engineer","Engineer","Scientist"]
		hidden = true
	}
	
	//Boffin Assemble!
	DATA
	{
		type = string
		boffinTrait = @/boffinTraitList.Random() 
		boffinKerbal = RandomKerbalName(@/boffinIsFemale ? Female : Male)
		boffinPronoun = @/boffinIsFemale ? "she" : "he"
		hidden = true
	}
	
	// create boffin
	DATA
	{
		type = List<Kerbal>
		kerbalsBoffins = NewKerbal( @/boffinIsFemale ? Female : Male, @/boffinKerbal , @boffinTrait )
		hidden = true
	}
//------------------------------------------------------------------------
//BEHAVIOURS TO DO WHEN CREATING CONTRACT
//------------------------------------------------------------------------
	// Boffin Behaviours
    // Spawn the Boffin
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		kerbal = @/kerbalsBoffins.ElementAt(0)
		kerbalType = Unowned
		removePassengers = false
	}
	// Make Boffin Crew
	BEHAVIOUR
    {
        name = ChangeKerbalType
		type = ChangeKerbalType
        onState = PARAMETER_COMPLETED
		parameter = BoffinCheckYes
 		KERBAL_INFO
		{
			kerbal = @/kerbalsBoffins.ElementAt(0)
			kerbalType = Crew
		}
	}
	BEHAVIOUR
	{
		name = Message
		type = Message
		title = You have a new Crew Member!
		message = This is inform you that @/boffinKerbal has joined the Kerbal Space Program! 
		CONDITION
		{
			condition = PARAMETER_COMPLETED
			parameter = BoffinCheckYes
		}
	}
// Waypoints for cargo Flight								   
	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator
		WAYPOINT
		{
			name = @/baseIATAcode0 + "Runway"
			icon = GAPFAS/Assets/Icons/Airport
			targetBody = @/targetBody
			latitude = @GFAS:siteLAT.ElementAt(0)
			longitude = @GFAS:siteLON.ElementAt(0)
			altitude = 0
			parameter = RequestTakeoffSite3
		}
		
		WAYPOINT
		{
			name = @/baseIATAcode0 + "Air Terminal"
			icon = GAPFAS/Assets/Icons/terminal
			targetBody =  @/targetBody
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(0)
			longitude = @GFAS:terminalLON.ElementAt(0)
			parameter = RequestLandingKSC
		}
		// Pick up site
		WAYPOINT
		{
			name = @/baseFullName1 + "Runway"
			icon = GAPFAS/Assets/Icons/Airport
			altitude = 0
			latitude = @GFAS:siteLAT.ElementAt(@/fltLocationSelection)
			longitude = @GFAS:siteLON.ElementAt(@/fltLocationSelection)
            parameter = RequestTakeoffLaunch							
		}
		//Delivery site
		WAYPOINT
		{
			name = @/baseFullName1 + "Air Terminal"
			icon = GAPFAS/Assets/Icons/terminal
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(@/fltLocationSelection)
			longitude = @GFAS:terminalLON.ElementAt(@/fltLocationSelection)
			parameter = RequestLandingSite2
		}

		WAYPOINT
		{
			name = name = @/baseFullName2 + "Runway"
			icon = GAPFAS/Assets/Icons/Airport
			altitude = 0
			latitude = @GFAS:siteLAT.ElementAt(@/fltLocationSelection2)
			longitude = @GFAS:siteLON.ElementAt(@/fltLocationSelection2)
			parameter = RequestTakeoffSite2
		}
		WAYPOINT
		{
			name = @/baseFullName2 + "Air Terminal"
			icon = GAPFAS/Assets/Icons/terminal
			altitude = 0
			latitude = @GFAS:terminalLAT.ElementAt(@/fltLocationSelection2)
			longitude = @GFAS:terminalLON.ElementAt(@/fltLocationSelection2)
			parameter = RequestLandingSite3
		}

	}
