// -----------------------------------------------------------------
//	CONTRACT Groups: GAP For All Systems  
//	Author: Caerfinon 
// -----------------------------------------------------------------
// In the folder GameData\GAPFAS\Patches there is a file called GAPFASContractGroupPatch.cfg.StockTemplate
// Copy this file to a directory in your GameData where you normally keep your Module Manager patch files
// Rename the file to GAPFASContractGroupPatch.cfg
// This is the file you will edit to define your world's bases 
// -----------------------------------------------------------------

CONTRACT_GROUP
{
    name = GFAS
    displayName = GAP For All Systems
    sortKey = GAPFAS00
    agent = GAP For All Systems
    minVersion = 1.30.5
    maxCompletions = 0
    maxSimultaneous = 0

// -----------------------------------------------------------------
// Data Nodes
// -----------------------------------------------------------------	
	
	// What planet is the homeworld?
	DATA
	{
		type = CelestialBody	
		whereAreWe = HomeWorld() 
	}

	// On the HomeWorld what is the the altitude of the flying high/flying low border?
	DATA
	{
		type = float	
		flyHiLo = HomeWorld().FlyingAltitudeThreshold()
		flySpace = HomeWorld().AtmosphereAltitude() 
	}
	
	// Base value of Mission Rewards
	DATA
	{
		type = double	
		rewardBaseValue = (HomeWorld().Radius() / 1000 ) * 10
	}
	
	// The percentage chance that a Boffin will join the Space Program
	DATA
	{
		type = int	
		boffinChoiceChance = 4
	}
	
	// Flight destinations start at index 1
	DATA
	{
		type = int	
		siteComm2Start = 1
	}

	// Flight destinations end at the count of all sites minus 1 for the KSC. 
	DATA
	{
		type = int	
		siteComm2Stop = @/siteName.Count() - 1
	}
// -----------------------------------------------------------------
// All base data needs to be loaded from a Module Manager patch file. See README.MD
// -----------------------------------------------------------------

// -----------------------------------------------------------------
// Sub Groups
// -----------------------------------------------------------------

	// Science and milestone flights
	CONTRACT_GROUP
	{
		name = KSP Air Service Science
		displayName = KSP Air Service Science
		minVersion = 1.30.5
		sortKey = GAPFAS01
		agent = KSP Air Service
		maxSimultaneous = 3
		maxCompletions = 0
    }
	
	// Passenger flights. VIK flights
	CONTRACT_GROUP
	{
		name = KSP Air Service Transport
		displayName = KSP Air Service Transport
		minVersion = 1.30.5
		sortKey = GAPFAS02
		agent = KSP Air Service
		maxSimultaneous = 3
		maxCompletions = 0
	}
	
	// Cargo flights to random airport and delivery at Boneyard with return to KSC
	CONTRACT_GROUP
	{
		name = KSP Air Service Cargo
		displayName = KSP Air Service Cargo
		minVersion = 1.30.5
		sortKey = GAPFAS03
		agent = KSP Air Service
		maxSimultaneous = 2
		maxCompletions = 0
	}
	
	// Rescue flights
	CONTRACT_GROUP
	{
		name = KSP Air Service Rescue
		displayName = KSP Air Service Rescue
		minVersion = 1.30.5
		sortKey = GAPFAS04
		agent = KSP Air Service
		maxSimultaneous = 1
		maxCompletions = 0
		
	}
}

