	}
	
	// The Waypoint locations of your airports: The LON/LAT of the major runway, The LON/LAT of the airport terminal
    // The terminal location is where aircraft need to move to in your base to satisfy contract conditions
    // The terminal is the location where VIK passengers spawn and need to be picked up from
   	// The first entry in the list must always be the KSC location on any world 
	DATA
    {
        type = List<double>	
		siteLAT = [-0.0492631496694876,-1.517718751,-6.520091272,6.952152729]
		siteLON = [-74.614253751157,-71.906177285227,-144.0394052,-77.93811035]
		terminalLAT = [-0.0657987936980026,-1.523578027,-6.528841525,6.93504741]
		terminalLON = [-74.6234648947342,-71.89942326,-144.0300105,-77.93811035]
	}
	
	// The Index for multiple site flights. Each corresponds to the data for a named airport defined above. The value is the index of the second airport to be flown to.
	// The first entry in the list must always be the KSC location on any world 	
	DATA
    {
        type = List<int>
		siteMultiFlight = [0,2,1,1]
	}	

