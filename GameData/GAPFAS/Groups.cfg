// Common Group Data that defines all airports for contracts
 
	// The names of your airports:  Full name, Airport Itentifier, Flight number base
	// The first entry in the list must always be the KSC location on any world 
	DATA
    {
        type = List<string>
		siteFullName = ["Kerbin Space Center", "Island Airfiled", "Desert Airfield"]
		siteName = ["KSC", "IAF", "DAF"]	
	}
	
	// The Waypoint locations of your airports: The LON/LAT of the major runway, The LON/LAT of the airport terminal
    // The terminal location is where aircraft need to move to in your base to satisfy contract conditions
    // The terminal is the location where VIK passengers spawn and need to be picked up from
   	// The first entry in the list must always be the KSC location on any world 
	DATA
    {
        type = List<double>	
		siteLAT = [-0.0492631496694876,-1.517718751,-6.520091272]
		siteLON = [-74.614253751157,-71.906177285227,-144.0394052]
		terminalLAT = [-0.0619815828104243,-1.523578027,-6.528841525]
		terminalLON = [-74.6285456052609,-71.89942326,-144.0300105]
	}
	
	// The Index for multiple site flights. Each corresponds to the data for a named airport defined above. The value is the index of the second airport to be flown to.
	// The baseCheck enty determines is the Kerbal Konstructs Base Open requirement is needed to have a flight to that location. 0 is for no (useful for stock non KK runways), 1 is for yes. 
	// The first entry in the list must always be the KSC location on any world 	
	DATA
    {
        type = List<int>
		siteMultiFlight = [0,2,1]
		baseCheck = [0,0,0]

	}	
	
